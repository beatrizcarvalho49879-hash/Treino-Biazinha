<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biazinha">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Treino Biazinha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap">
</head><body>
<style>
/* Layout: zine fotocopiado — fundo preto com retícula, cartões de papel colados com fita, um título em letras de bilhete de resgate. Tema escuro fixo, de propósito. */
:root{
  --ink:#0f0c0e; --ink2:#1d181b; --line:#3a3036;
  --paper:#eee7d9; --paper2:#d9cfbc; --text-on-paper:#141012; --muted-on-paper:#5f5459;
  --pink:#ff2d7a; --tape:#ffd21f; --dim:#9c8f98; --fg:#f4eee6;
  --down:#ff7a45; --alarm:#ff3b30;
  --f-display:"Anton","HelveticaNeue-CondensedBlack","Futura-CondensedExtraBold",Impact,"Arial Narrow",sans-serif;
  --f-type:"Special Elite","American Typewriter","Courier New",monospace;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{
  color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.6px);
  background-size:7px 7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

/* ---------- topo ---------- */
.top{padding-block:22px 10px;display:flex;flex-direction:column;gap:8px}
.ransom{font-size:clamp(30px,9.5vw,60px);line-height:1;display:flex;flex-wrap:wrap;gap:8px 14px;letter-spacing:0}
.ransom span{display:inline-block;padding:2px 5px 0;font-family:var(--f-display);text-transform:uppercase}
.ransom .word{display:flex;gap:2px;padding:0;background:none;border:0;transform:none}
.ransom .r0{background:var(--paper);color:var(--text-on-paper);transform:rotate(-3deg)}
.ransom .r1{background:var(--pink);color:var(--ink);transform:rotate(2deg)}
.ransom .r2{color:var(--fg);border:2px solid var(--fg);font-family:var(--f-type);transform:rotate(-1deg)}
.ransom .r3{background:var(--tape);color:var(--ink);transform:rotate(1.5deg)}
.ransom .r4{color:var(--pink);font-family:var(--f-type);transform:rotate(3deg)}
.dateline{font-family:var(--f-type);color:var(--dim);font-size:14px;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.dateline b{color:var(--tape);font-weight:400}
.warn{font-family:var(--f-type);font-size:13px;background:var(--down);color:var(--ink);padding:6px 10px}
.lchip{font-family:var(--f-body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border:2px solid var(--fg);color:var(--fg)}
.lchip.l1{border-color:var(--tape);color:var(--tape)}
.lchip.l2{background:var(--down);border-color:var(--down);color:var(--ink)}
.lchip.l3{background:var(--alarm);border-color:var(--alarm);color:var(--fg)}

/* ---------- abas ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);border-top:3px solid var(--pink);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;padding:10px 2px 8px;font-family:var(--f-display);font-size:14px;letter-spacing:.02em;color:var(--dim);text-transform:uppercase;min-width:0}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--pink);transform:rotate(-1.5deg)}

/* ---------- seletores ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.daybtn{border:2px solid var(--fg);background:transparent;padding:8px 12px;font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-align:left}
.daybtn small{display:block;font-family:var(--f-type);font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim)}
.daybtn[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.daybtn[aria-pressed="true"] small{color:var(--ink)}

section{display:flex;flex-direction:column;gap:18px;padding-block:10px}
.label{font-family:var(--f-display);font-size:22px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.label::after{content:"";flex:1;height:3px;background:repeating-linear-gradient(90deg,var(--fg) 0 8px,transparent 8px 12px)}
.sub{font-family:var(--f-type);color:var(--dim);font-size:13px;margin:0}
.paper .sub{color:var(--muted-on-paper)}

/* ---------- cartão de papel ---------- */
.paper{position:relative;background:var(--paper);color:var(--text-on-paper);padding:18px 16px 14px;box-shadow:5px 5px 0 var(--pink)}
.paper:nth-of-type(odd){transform:rotate(-.35deg)}
.paper:nth-of-type(even){transform:rotate(.3deg)}
.paper::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;margin-left:-42px;background:rgba(255,210,31,.82);transform:rotate(-4deg)}
.paper.alt{box-shadow:5px 5px 0 var(--tape)}
.paper.flat{transform:none}
.paper.red{box-shadow:5px 5px 0 var(--alarm);outline:4px solid var(--alarm)}

.ex header{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;align-items:center}
.thumb{width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid var(--text-on-paper);display:grid;place-items:center;overflow:hidden;grid-row:span 2;color:var(--text-on-paper)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44px;height:44px}
.num{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--pink);-webkit-text-stroke:1px var(--text-on-paper);grid-row:span 2}
.ex h3{font-family:var(--f-display);font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.ex .en{font-family:var(--f-type);font-size:12px;color:var(--muted-on-paper)}
.ex.isdone{box-shadow:5px 5px 0 var(--tape)}
.ex.isskip{opacity:.6}
.stamp{display:inline-block;font-family:var(--f-display);font-size:16px;letter-spacing:.08em;border:3px solid var(--text-on-paper);padding:0 8px;transform:rotate(-4deg);margin-top:6px}
.stamp.pink{border-color:var(--pink);color:var(--pink)}
.mus{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.m{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;line-height:1.2}
.m.p{background:var(--text-on-paper);color:var(--pink)}
.m.s{border:1.5px dashed var(--text-on-paper)}
.m.l1{background:var(--tape);color:var(--text-on-paper)}
.m.l2{background:var(--down);color:var(--text-on-paper)}
.m.rx{background:var(--alarm);color:#fff}
.meta{font-family:var(--f-type);font-size:13px;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{font-weight:400;background:var(--paper2);padding:0 4px}
.sug{margin-top:10px;padding:8px 10px;font-size:13.5px;border-left:6px solid var(--text-on-paper);background:#fff8}
.sug strong{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.04em;display:block;text-transform:uppercase}
.sug.up{background:var(--tape);border-color:var(--text-on-paper)}
.sug.down{background:#ffd5c4;border-color:var(--down)}
.sug.hold{background:#ffd5c4;border-color:var(--alarm)}
.sug.new{background:#fff;border-style:dashed}

.sets{display:grid;gap:6px;margin-top:12px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 50px;gap:6px;align-items:center}
.set.time{grid-template-columns:26px 2fr 50px}
.set .n{font-family:var(--f-display);font-size:18px;text-align:center}
.set label{position:relative;display:block}
.set label span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--f-type);font-size:12px;color:#7a6d73;pointer-events:none}
.set input{width:100%;min-width:0;background:#fff;border:2px solid var(--text-on-paper);padding:10px 36px 10px 9px;font-family:var(--f-type);font-size:18px;color:var(--text-on-paper);border-radius:0;font-variant-numeric:tabular-nums}
.set input::placeholder{color:#a3979c}
.chk{height:48px;border:2px solid var(--text-on-paper);background:transparent;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--text-on-paper)}
.set.ok input{background:var(--paper2)}
.set.ok .chk{background:var(--text-on-paper);color:var(--pink)}
.rir{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px;font-family:var(--f-type);font-size:12.5px}
.rir button{min-width:38px;height:34px;border:2px solid var(--text-on-paper);background:transparent;font-weight:700;color:var(--text-on-paper)}
.rir button[aria-pressed="true"]{background:var(--text-on-paper);color:var(--tape)}
.note{width:100%;margin-top:8px;border:2px dashed var(--text-on-paper);background:#fff6;padding:8px;font-family:var(--f-type);font-size:14px;color:var(--text-on-paper);border-radius:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mini{background:transparent;border:1.5px solid currentColor;padding:7px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mini.on{background:var(--text-on-paper);color:var(--paper)}
.how{margin-top:10px;font-size:13.5px;border-top:2px dashed var(--text-on-paper);padding-top:8px}
.how p{margin:4px 0}
.box{margin-top:10px;border:2px solid var(--text-on-paper);padding:10px;background:#fff7;display:grid;gap:8px;font-size:13.5px;color:var(--text-on-paper)}
.box h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.alt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border-top:1.5px dashed #0004;padding-top:8px;align-items:center}
.alt .t{font-weight:700}
.alt .t small{display:block;font-weight:400;font-size:12px;color:var(--muted-on-paper)}
.alt .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}

.big{display:block;width:100%;border:3px solid var(--fg);background:var(--pink);color:var(--ink);font-family:var(--f-display);font-size:26px;letter-spacing:.06em;padding:14px;text-transform:uppercase;box-shadow:5px 5px 0 var(--fg)}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--fg)}
.ghost{background:transparent;border:2px solid var(--fg);padding:8px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.ghost.danger{border-color:var(--down);color:var(--down)}
.ghost.on{background:var(--fg);color:var(--ink)}

.sticker{display:inline-block;background:var(--tape);color:var(--ink);font-family:var(--f-type);padding:6px 10px;transform:rotate(-1deg);font-size:14px}
.focus{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* barra da sessão + trilha de progresso */
.sess{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:3px solid var(--fg);padding:10px 12px;background:var(--ink2)}
.sess .clk{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--tape)}
.sess .st{font-family:var(--f-type);font-size:12px;color:var(--dim);display:block}
.strip{display:flex;flex-wrap:wrap;gap:5px}
.strip button{min-width:38px;height:38px;border:2px solid var(--fg);background:transparent;font-family:var(--f-display);font-size:16px;color:var(--fg)}
.strip button.part{background:linear-gradient(90deg,var(--tape) 50%,transparent 50%)}
.strip button.done{background:var(--tape);color:var(--ink);border-color:var(--tape)}
.strip button.skip{border-style:dashed;color:var(--dim);text-decoration:line-through}
.strip button.wc{font-size:12px;min-width:auto;padding:0 8px}
.progress{height:14px;border:2px solid var(--fg);position:relative;background:var(--ink2)}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--pink)}

/* timer */
.timer{position:fixed;z-index:19;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  background:var(--tape);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--pink);padding:8px 10px;display:flex;align-items:center;gap:10px;transform:rotate(-2deg)}
.timer b{font-family:var(--f-display);font-size:30px;font-weight:400;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.timer button{background:var(--ink);color:var(--tape);border:0;padding:8px 10px;font-weight:700;font-size:12px}
.timer .tl{font-family:var(--f-type);font-size:12px}
.timer.done{background:var(--pink);animation:shake .4s 3}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:var(--pink);opacity:0}
.flash.go{animation:fl 1.2s ease-out}
@keyframes fl{0%,30%{opacity:.55}100%{opacity:0}}
@keyframes shake{50%{transform:rotate(2deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}.flash.go{animation:none}}

/* formulários */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-type);font-size:12px;color:var(--dim)}
.form input,.form select,.inline input,.inline select,textarea,.dk{background:var(--ink2);border:2px solid var(--line);padding:10px;font-size:16px;color:var(--fg);border-radius:0;width:100%;min-width:0}
.form .full{grid-column:1/-1}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inline>*{flex:1 1 120px}
.inline button{flex:0 0 auto}
textarea{font-family:var(--f-type);font-size:12px;min-height:110px}
.paper .form label{color:var(--muted-on-paper)}
.paper .form input,.paper .form select,.paper textarea,.paper .pin,.paper .inline input,.paper .inline select{background:#fff;border:2px solid var(--text-on-paper);color:var(--text-on-paper);padding:9px;border-radius:0;min-width:0;width:100%;font-size:16px}
.tog{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.tog input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--pink);margin:0}
input[type=range]{width:100%;accent-color:var(--pink)}
.q{display:grid;gap:6px;border-top:1.5px dashed #0004;padding-top:10px}
.q>b{font-size:14px}
.yn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.yn button{border:2px solid var(--text-on-paper);background:transparent;padding:8px 14px;font-weight:700;color:var(--text-on-paper);font-size:13px;text-transform:uppercase}
.yn button[aria-pressed="true"]{background:var(--text-on-paper);color:var(--tape)}
.painv{font-family:var(--f-display);font-size:34px;line-height:1}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:2px solid var(--fg);padding:10px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;color:var(--tape);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-type);font-size:12px;color:var(--dim)}

/* volume */
.vol{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:118px 1fr 46px;gap:8px;align-items:center;font-size:13px}
.vrow .nm{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.03em;overflow-wrap:anywhere;line-height:1.15}
.bar{position:relative;height:18px;border:2px solid var(--fg);background:var(--ink2)}
.bar .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 4px,transparent 4px 8px)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--pink)}
.bar .fill.lo{background:var(--down)}
.bar .fill.ok{background:var(--tape)}
.vrow .v{font-family:var(--f-type);text-align:right;font-variant-numeric:tabular-nums}

/* mapa muscular */
.map{display:grid;gap:8px}
.map svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.map .sil{fill:var(--ink2);stroke:var(--line);stroke-width:1.5}
.map .mz{stroke:var(--ink);stroke-width:1.2;cursor:pointer;fill:var(--line)}
.map .mz.s0{fill:var(--ink2);stroke:var(--dim);stroke-dasharray:3 2}
.map .mz.s1{fill:var(--down)}
.map .mz.s2{fill:var(--tape)}
.map .mz.s3{fill:var(--pink)}
.map .mz.sel{stroke:var(--fg);stroke-width:3;stroke-dasharray:none}
.map .lomb{fill:url(#hatch);stroke:var(--dim);stroke-width:1}
.map text{font-family:var(--f-display);font-size:12px;fill:var(--dim);letter-spacing:.1em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-family:var(--f-type);color:var(--dim)}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--fg)}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.wd span{font-family:var(--f-type);font-size:12px;color:var(--dim)}
.wd.today span{color:var(--tape)}
.wd select{appearance:none;-webkit-appearance:none;background:var(--ink2);border:2px solid var(--line);color:var(--fg);padding:8px 0;text-align:center;text-align-last:center;font-family:var(--f-display);font-size:13px;border-radius:0;width:100%}
.wd.today select{border-color:var(--tape)}

.budget{display:flex;height:30px;border:2px solid var(--text-on-paper);font-family:var(--f-display);font-size:12px;letter-spacing:.04em;overflow:hidden}
.budget div{display:grid;place-items:center;white-space:nowrap;overflow:hidden;padding:0 4px}
.budget .w{background:var(--paper2)}
.budget .r{background:var(--text-on-paper);color:var(--tape)}
.budget .r.over{background:var(--alarm);color:#fff}
.budget .c{background:var(--tape)}
.plist{display:grid;gap:8px}
.pi{display:grid;grid-template-columns:1fr auto;gap:6px 10px;border-bottom:2px dashed #0003;padding-bottom:8px}
.pi.ov{background:repeating-linear-gradient(45deg,#ff3b3014 0 6px,transparent 6px 12px)}
.pi .t{font-weight:700;font-size:14px;min-width:0}
.pi .t small{display:block;font-weight:400;font-family:var(--f-type);font-size:11.5px;color:var(--muted-on-paper)}
.pi .ctl{display:flex;gap:4px;align-items:center}
.pi .ctl button{width:34px;height:34px;border:2px solid var(--text-on-paper);background:transparent;font-weight:700;color:var(--text-on-paper)}
.pi .ctl button.pr{width:auto;padding:0 6px;font-size:10.5px}
.pi .ctl button.pr.e{background:var(--text-on-paper);color:var(--tape)}
.pi .nums{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-family:var(--f-type);font-size:13px;flex-wrap:wrap}
.pi .nums input{width:52px;border:2px solid var(--text-on-paper);background:#fff;padding:5px;font-family:var(--f-type);font-size:15px;color:var(--text-on-paper);border-radius:0}
.pi>.box{grid-column:1/-1}
.paper select,.paper .pin{border:2px solid var(--text-on-paper);background:#fff;color:var(--text-on-paper);padding:8px;border-radius:0;min-width:0}

/* dicas / assistente */
.tip{display:grid;gap:6px}
.tag{justify-self:start;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;padding:2px 8px;background:var(--text-on-paper);color:var(--paper)}
.tag.pri{background:var(--pink);color:var(--ink)}
.tag.ok{background:var(--tape);color:var(--ink)}
.tag.pro{background:var(--alarm);color:#fff}
.tip h3{font-family:var(--f-display);font-size:22px;text-transform:uppercase;line-height:1.1}
.tip p{margin:0;font-size:14.5px;max-width:62ch}
.tip ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.tip li{margin:3px 0}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:2px solid var(--fg);background:transparent;padding:8px 10px;font-size:13px;text-align:left;color:var(--fg)}
.qchips button[aria-pressed="true"]{background:var(--pink);color:var(--ink);border-color:var(--pink)}

.hist{display:grid;gap:8px}
.hi{border:2px solid var(--line);padding:10px;display:grid;gap:4px;font-size:13px}
.hi .h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hi .h b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.04em}
.hi .d{font-family:var(--f-type);color:var(--dim);font-size:12px;overflow-wrap:anywhere}
.lib{display:grid;gap:6px}
.lib button.li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--ink2);padding:8px;color:var(--fg)}
.lib button.li>span{min-width:0}
.lib .thumb{width:44px;height:44px;grid-row:auto}
.lib .thumb svg{width:32px;height:32px}
.lib small{display:block;font-family:var(--f-type);color:var(--dim);font-size:11.5px}
.eqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border-bottom:1.5px dashed var(--line);padding-block:8px}
.eqrow .yn button{border-color:var(--fg);color:var(--fg);padding:6px 9px;font-size:11px}
.eqrow .yn button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.eqrow img{width:56px;height:56px;object-fit:cover;border:2px solid var(--fg)}

table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1.5px dashed var(--line);padding:6px 4px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-family:var(--f-type);font-weight:400;color:var(--dim);font-size:12px}
.paper table.t th,.paper table.t td{border-color:#0003}
.paper table.t th{color:var(--muted-on-paper)}
.scroll{overflow-x:auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos figure{margin:0;border:2px solid var(--fg);background:var(--ink2);min-height:120px;display:grid;place-items:center}
.photos img{width:100%;display:block}
.photos figcaption{font-family:var(--f-type);font-size:12px;color:var(--dim);padding:4px 6px;width:100%}

.done-card{background:var(--pink);color:var(--ink);padding:16px;border:3px solid var(--fg);box-shadow:5px 5px 0 var(--fg)}
.done-card h3{font-family:var(--f-display);font-size:30px;text-transform:uppercase}
.done-card p{margin:4px 0 0}
.done-card .ghost{border-color:var(--ink);color:var(--ink)}
svg text{fill:var(--dim);font-family:var(--f-type);font-size:11px}
.paper svg text{fill:var(--muted-on-paper)}
.empty{font-family:var(--f-type);color:var(--dim);border:2px dashed var(--line);padding:14px;font-size:13px}
.empty .mini{color:var(--fg)}
.paper .empty{color:var(--muted-on-paper);border-color:#0003}
details.fold{border:2px solid var(--line);padding:0}
details.fold>summary{cursor:pointer;padding:12px;font-family:var(--f-display);font-size:19px;letter-spacing:.05em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::after{content:"+";color:var(--pink)}
details.fold[open]>summary::after{content:"−"}
details.fold>div{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}
@media (max-width:420px){.vrow{grid-template-columns:100px 1fr 40px}}

function migrate(s){
  if(!s || typeof s!=="object") return fresh();
  if((s.v||1)>=2){const n=Object.assign(fresh(),s);n.ui=Object.assign(fresh().ui,s.ui||{});return n}
  // v1 → v2. Nada é apagado: uma cópia da versão anterior fica guardada.
  try{localStorage.setItem(KEY+"-backup-v1",JSON.stringify(s))}catch(e){}
  const n=fresh(), notes=[];
  n.profile=Object.assign(n.profile,s.profile||{});
  
  
  n.profile.restr=n.profile.restr||fresh().profile.restr; n.profile.recs=n.profile.recs||[];
  n.history=s.history||[]; n.acts=s.acts||[];
  n.measures=(s.pesoLog||[]).map(x=>({d:x.d,peso:String(x.kg)}));
  const untouched = s.plan && ["A","B","C"].every(d=>s.plan[d]&&s.plan[d].ex.map(x=>x.id).join(",")===V1_IDS[d]);
  if(untouched){
    // A antigo (glúteo & posterior) vira C; C antigo (quadríceps) vira A, como na nova divisão.
    const map={A:"C",C:"A",B:"B"};
    n.history.forEach(h=>{if(map[h.day])h.day=map[h.day]});
    n.drafts={}; Object.entries(s.drafts||{}).forEach(([k,v])=>{n.drafts[map[k]||k]=v});
    n.plan=clone(PLAN_V2);
    notes.push("Treinos reorganizados: A = quadríceps & glúteos, B = superiores & core, C = glúteos & posteriores, D opcional. Exercícios de alta exigência lombar saíram do plano padrão (dá para recolocar em Plano).");
  } else {
    n.plan={}; ["A","B","C"].forEach(d=>{n.plan[d]=s.plan[d];n.plan[d].ex.forEach(it=>it.prio=it.prio||"e")});
    n.plan.D=clone(PLAN_V2.D); n.drafts=s.drafts||{};
    notes.push("Seu plano editado foi mantido. Adicionei o Treino D opcional e a marcação essencial/complementar.");
  }
  const oldWeek=(s.week||[]).join(",");
  n.week = oldWeek==="A,pilates,B,cardio,C,livre,descanso"?WEEK_V2.slice():(s.week||WEEK_V2.slice());
  notes.push("Nenhum registro foi apagado. Uma cópia da versão anterior ficou guardada no aparelho.");
  n.notices=notes;
  return n;
}

async function phPut(rec){const db=await idb();await new Promise((r,j)=>{const t=db.transaction("fotos","readwrite");t.objectStore("fotos").put(rec);t.oncomplete=r;t.onerror=()=>j(t.error)});PH=PH.filter(x=>x.id!==rec.id);PH.push(rec)}
async function phDel(id){try{const db=await idb();await new Promise(r=>{const t=db.transaction("fotos","readwrite");t.objectStore("fotos").delete(id);t.oncomplete=r;t.onerror=r})}catch(e){}PH=PH.filter(x=>x.id!==id)}
function shrink(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function lastCheckin(maxDays=3){return S.checkins.filter(c=>daysAgo(c.date)<=maxDays).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.t||0)-(a.t||0))[0]||null}
function lumbar(){
  const c=lastCheckin(3); if(!c) return {lv:0,c:null,why:[]};
  const why=[];
  if(c.red&&(c.red.urin||c.red.sela||c.red.fraqProg)) return {lv:3,c,why:["sinal de alerta"]};
  const prev=S.checkins.filter(x=>x!==c&&x.date<c.date).sort((a,b)=>a.date<b.date?1:-1)[0];
  if(c.irr) why.push("dor irradiada"); if(c.formig) why.push("formigamento"); if(c.fraq) why.push("fraqueza nova");
  if(c.piorou) why.push(`piora após ${ex(c.piorou).n}`); if(num(c.dor)>=4) why.push(`dor ${c.dor}/10`);
  if(prev&&num(c.dor)-num(prev.dor)>=2) why.push("dor subiu desde o último check-in");
  if(why.length) return {lv:2,c,why};
  if(num(c.dor)>0) return {lv:1,c,why:[`dor ${c.dor}/10`]};
  return {lv:0,c,why:[]};
}

  const sx=symFor(item.id), rx=restrictedBy(item.id);
  const holdWhy = rx.length?`Seu profissional pediu para evitar: ${rx.map(r=>RESTR[r].split(" (")[0].toLowerCase()).join(", ")}.`
    : sx.length?`Você registrou sintoma neste exercício em ${dmy(sx[0].date)}.`
    : lb.lv>=2?`Check-in indica piora (${lb.why.join(", ")}).`
    : (lb.lv===1&&e.lomb>=1)?`Dor lombar hoje e este exercício exige atenção da lombar.`:"";
  if(!last){
    if(holdWhy) return {lvl:"hold",head:"Revisar antes de fazer",txt:`${holdWhy} Considere uma alternativa ou carga bem leve, e pare se reproduzir dor irradiada.`,kg:null,r:item.lo};
    return {lvl:"new",head:"Primeira vez",txt:`Escolha uma carga em que a última rep da faixa ${rng} saia com 1–2 reps sobrando.`,kg:null,r:item.lo};
  }
  const sets=last.sets[item.id].filter(x=>num(x.r)), reps=sets.map(x=>num(x.r)), kg=topKg(sets);
  const rir=last.rir?num(last.rir[item.id]):null;
  const minR=Math.min(...reps), allTop=reps.every(r=>r>=item.hi), allLo=reps.every(r=>r>=item.lo);
  let out;
  if(holdWhy){
    out={lvl:"hold",head:kg?`Sem aumento: no máximo ${fmt(kg)} kg`:"Sem aumento hoje",txt:`${holdWhy} Não suba carga. Considere uma alternativa, reduzir amplitude ou carga, e interrompa se o movimento provocar dor irradiada.`,kg,r:item.lo};
  } else if(isTime(item.id)){
    out = allTop?{lvl:"up",head:`Sobe para ${item.hi+10}s`,txt:`Você segurou ${reps.join("/")}s.`,kg:null,r:item.hi+10}
        :{lvl:"keep",head:`Mira ${Math.min(item.hi,minR+5)}s`,txt:`Última: ${reps.join("/")}s. Some 5 s por série até ${item.hi}s.`,kg:null,r:Math.min(item.hi,minR+5)};
  } else if(kg==null||kg===0){
    out = allTop?{lvl:"up",head:"Dificulte",txt:`Bateu ${item.hi} reps em todas. Adicione carga ou faça a descida mais lenta.`,kg:null,r:item.lo}
        :{lvl:"keep",head:`Mira ${Math.min(item.hi,minR+1)}+ reps`,txt:`Última: ${reps.join("/")}. Tente 1 rep a mais por série.`,kg:null,r:Math.min(item.hi,minR+1)};
  } else if(allTop && rir===0){
    out={lvl:"keep",head:`Repete ${fmt(kg)} kg`,txt:`Bateu ${item.hi} em todas, mas a última série foi até a falha (RIR 0). Repita a carga e suba quando sobrar 1–2 reps.`,kg,r:item.hi};
  } else if(allTop){
    const nk=kg+(e.eq.includes("halteres")?1:e.eq.includes("legpress")?5:2.5);
    out={lvl:"up",head:`Sobe para ${fmt(nk)} kg`,txt:`Você fez ${reps.join("/")} com ${fmt(kg)} kg${rir!=null?` (RIR ${rir})`:""}: topo da faixa em todas. Com a carga nova, volte para ${item.lo} reps. Só suba se a técnica estiver boa.`,kg:nk,r:item.lo};
  } else if(allLo){
    out={lvl:"keep",head:`Fica em ${fmt(kg)} kg, mira ${Math.min(item.hi,minR+1)} reps`,txt:`Última: ${reps.join("/")}. Quando fizer ${item.hi} em todas as séries, a carga sobe.`,kg,r:Math.min(item.hi,minR+1)};
  } else if(minR<item.lo-2){
    const nk=Math.max(0,kg-(e.eq.includes("halteres")?1:2.5));
    out={lvl:"down",head:`Desce para ${fmt(nk)} kg`,txt:`Última: ${reps.join("/")}, abaixo da faixa ${rng}.`,kg:nk,r:item.lo};
  } else {
    out={lvl:"keep",head:`Fica em ${fmt(kg)} kg, mira ${item.lo} reps`,txt:`Última: ${reps.join("/")}. Complete ${item.lo} em todas antes de subir.`,kg,r:item.lo};
  }
  const l3=sessionsFor(item.id).slice(-3);
  if(out.lvl!=="hold"&&l3.length===3){const sig=l3.map(h=>{const s=h.sets[item.id].filter(x=>num(x.r));return `${topKg(s)}|${s.reduce((a,x)=>a+num(x.r),0)}`});
    if(sig[0]===sig[1]&&sig[1]===sig[2]) out.txt+=" Três treinos iguais seguidos: tente descer em 3 s ou pausar 1 s no ponto difícil."}
  out.last=last; return out;
}

/* ---------- tempo da sessão ---------- */
function estSec(it){const e=ex(it.id),k=e.uni?2:1,work=isTime(it.id)?Math.max(20,it.hi):40,rest=num(it.rest)||e.rest;return it.s*k*work+(it.s-1)*rest+75}
function budget(day){
  const L=S.plan[day]?S.plan[day].ex:[]; let t=0; const fit=new Set(), over=[];
  ["e","c"].forEach(p=>L.forEach((it,i)=>{if((it.prio||"e")!==p)return;const s=estSec(it);if(t+s<=RESIST_MIN*60){t+=s;fit.add(i)}else over.push(i)}));
  const all=L.reduce((a,it)=>a+estSec(it),0);
  return {fit,over,resist:t/60,all:all/60,total:WARM_MIN+t/60+CARDIO_MIN};
}

/* ---------- volume ---------- */
function blankSub(){const v={};Object.keys(SUB).forEach(k=>v[k]=0);return v}
function addVol(v,id,n){Object.entries(ex(id).w).forEach(([g,w])=>{if(v[g]!=null)v[g]+=n*w})}
function volSince(fromIso){const v=blankSub();S.history.filter(h=>h.date>=fromIso).forEach(h=>Object.entries(h.sets||{}).forEach(([id,s])=>addVol(v,id,s.filter(x=>num(x.r)).length)));return v}
function planVolume(){const v=blankSub();GYM.forEach(d=>{const times=S.week.filter(w=>w===d).length;if(!times||!S.plan[d])return;const b=budget(d);S.plan[d].ex.forEach((it,i)=>{if(b.fit.has(i))addVol(v,it.id,it.s*times)})});return v}
function stateOf(g,x){const T=S.targets[g]||SUB[g];return x<=0?0:x<T.lo?1:x>T.hi?3:2}
const STATE_N=["sem estímulo","volume reduzido","volume adequado","acima da faixa"];

/* ---------- alternativas ---------- */
function sim(a,b){const A=ex(a).w,B=ex(b).w;let dot=0,na=0,nb=0;Object.keys(SUB).forEach(k=>{const x=A[k]||0,y=B[k]||0;dot+=x*y;na+=x*x;nb+=y*y});return na&&nb?dot/Math.sqrt(na*nb):0}
function alternatives(id){
  const e=ex(id),main=primSubs(id);
  const ids=new Set([...(e.alt||[])]);
  Object.keys(EX).forEach(k=>{if(k!==id&&primSubs(k).some(g=>main.includes(g)))ids.add(k)});
  ids.delete(id);
  const avO={sim:0,"?":1,nao:2};
  return [...ids].filter(k=>EX[k]).map(k=>({id:k,s:sim(id,k),av:avail(k),rx:restrictedBy(k),lomb:ex(k).lomb,listed:(e.alt||[]).includes(k)}))
    .filter(a=>a.s>=.35)
    .sort((a,b)=>(a.rx.length-b.rx.length)||(avO[a.av]-avO[b.av])||(a.lomb-b.lomb)||(b.s-a.s)||(b.listed-a.listed)).slice(0,6);
}
const simTxt=s=>s>=.85?"estímulo parecido":s>=.6?"estímulo parcialmente parecido":"estímulo diferente";
function altBox(id,ctx){
  const list=alternatives(id), e=ex(id);
  return `<div class="box"><h4>Alternativas a ${esc(e.n)}</h4>
    <p class="sub" style="margin:0">Nenhuma alternativa é equivalente perfeita nem automaticamente segura para lesão discal. Escolha considerando seus sintomas, amplitude, carga, técnica e o que seu médico ou fisio orientou.</p>
    ${list.length?list.map(a=>`<div class="alt"><div class="t">${esc(ex(a.id).n)}<small>${esc(simTxt(a.s))} · ${esc(ex(a.id).eq.map(q=>EQ[q]||q).join(", "))}</small></div>
      <div class="row" style="margin:0">${ctx?`<button class="mini" type="button" data-a="swapToday" data-day="${ctx.day}" data-orig="${ctx.orig}" data-to="${a.id}">Só hoje</button><button class="mini" type="button" data-a="swapPlan" data-day="${ctx.day}" data-orig="${ctx.orig}" data-to="${a.id}">No plano</button>`:""}</div>
      <div class="tags"><span class="m ${a.lomb?"l"+a.lomb:"s"}">${LOMB[a.lomb]}</span><span class="m s">${AV[a.av]}</span>${a.rx.length?`<span class="m rx">restrição: ${esc(a.rx.join(", "))}</span>`:""}</div>
      <div class="sub" style="grid-column:1/-1">${esc(ex(a.id).ln)}</div></div>`).join(""):`<div class="empty">Nenhuma alternativa cadastrada para este grupo. Crie uma em Mais → Exercícios.</div>`}
  </div>`;
}

let tEnd=0,tInt=null,actx=null;
function beep(){
  if(!S.settings.sound) return;
  try{if(navigator.audioSession)navigator.audioSession.type="ambient"}catch(e){}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+o+.18);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.18)})}catch(e){}
}
function startTimer(sec){tEnd=Date.now()+sec*1000;const el=$("#timer");el.hidden=false;el.classList.remove("done");clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#timerT").textContent=`${Math.floor(left/60)}:${pad(left%60)}`;
  if(left<=0){clearInterval(tInt);$("#timer").classList.add("done");const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");beep();
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}setTimeout(()=>{$("#timer").hidden=true},6000)}
}
$("#timerPlus").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;$("#timer").classList.remove("done");clearInterval(tInt);tInt=setInterval(tick,250);tick()};
$("#timerStop").onclick=()=>{clearInterval(tInt);$("#timer").hidden=true};

const elapsed=d=>!d||!d.start?0:(Date.now()-d.start-(d.pausedMs||0)-(d.pauseAt?Date.now()-d.pauseAt:0));
const clock=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${pad(s%60)}`};
function tickSession(){const el=document.getElementById("sessClock");if(!el)return;el.textContent=clock(elapsed(S.drafts[el.dataset.day]))}
setInterval(tickSession,1000);
let wake=null;
async function reWake(){const anyRun=Object.values(S.drafts).some(d=>d.start&&!d.pauseAt);
  if(S.settings.wake&&anyRun&&!wake){try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}catch(e){}}

let finished=null;
function defaultDay(){
  const i=dowIdx(new Date()), s=S.week[i];
  const running=Object.entries(S.drafts).find(([k,d])=>d.start&&GYM.includes(k)); if(running) return running[0];
  if(GYM.includes(s)) return s;
  if(["pilates","cardio","recup"].includes(s)) return "extra";
  for(let k=1;k<7;k++){const n=S.week[(i+k)%7];if(GYM.includes(n))return n}
  return "A";
}
function blankDraft(){return {date:today(),start:null,pausedMs:0,pauseAt:null,sets:{},rir:{},notes:{},sym:{},swap:{},inc:{},skip:{},warm:{},cardio:{eq:"",int:"leve",min:"10",dist:"",rpe:"",adapt:false,nota:"",ok:false}}}
function draft(day){
  const d=S.drafts[day]=Object.assign(blankDraft(),S.drafts[day]||{});
  items(day).forEach(it=>{
    if(!d.sets[it.id]){const sg=suggest(it);d.sets[it.id]=Array.from({length:it.s},()=>({kg:sg.kg!=null?fmt(sg.kg):"",r:"",ok:false}))}
  });
  return d;
}
function items(day){
  const plan=S.plan[day]; if(!plan) return [];
  const b=budget(day), d=S.drafts[day];
  return plan.ex.map((it,i)=>({it,i})).filter(({it,i})=>b.fit.has(i)||(d&&d.inc&&d.inc[it.id]))
    .map(({it})=>Object.assign({},it,{orig:it.id,id:(d&&d.swap&&d.swap[it.id])||it.id}));
}
function exState(d,it){const s=d.sets[it.id]||[];if(d.skip[it.orig])return "skip";const ok=s.filter(x=>x.ok).length;return ok&&ok>=s.length?"done":ok?"part":""}

function vTreino(){
  const day=S.ui.day||defaultDay();
  const btns=GYM.map(d=>`<button class="daybtn" type="button" data-a="day" data-day="${d}" aria-pressed="${day===d}">${d}<small>${esc(S.plan[d].nome)}</small></button>`).join("")
    +`<button class="daybtn" type="button" data-a="day" data-day="extra" aria-pressed="${day==="extra"}">+<small>pilates / cardio / recup.</small></button>`;
  let body="";
  if(S.notices&&S.notices.length) body+=`<div class="done-card"><h3>App atualizado</h3>${S.notices.map(n=>`<p>${esc(n)}</p>`).join("")}<div class="row"><button class="ghost" type="button" data-a="closeNotice">Entendi</button></div></div>`;
  if(finished) body+=`<div class="done-card"><h3>${finished.t}</h3><p>${esc(finished.m)}</p><div class="row"><button class="ghost" type="button" data-a="closeDone">Fechar</button></div></div>`;
  body+= day==="extra"?vExtra():vSession(day);
  return `<section><div class="chips" role="group" aria-label="Escolha o treino">${btns}</div>${body}</section>`;
}
function vSession(day){
  const plan=S.plan[day], d=draft(day), list=items(day), b=budget(day), lb=lumbar();
  let h=vCheckin();
  if(lb.lv===3) return h;
  const st=!d.start?"não iniciado":d.pauseAt?"pausado":"em andamento";
  const okSets=list.reduce((a,it)=>a+(d.sets[it.id]||[]).filter(x=>x.ok).length,0), allSets=list.reduce((a,it)=>a+(d.sets[it.id]||[]).length,0);

    <div class="row" style="margin:0">${!d.start?`<button class="ghost on" type="button" data-a="start" data-day="${day}">Iniciar</button>`
      :d.pauseAt?`<button class="ghost on" type="button" data-a="resume" data-day="${day}">Retomar</button>`
      :`<button class="ghost" type="button" data-a="pause" data-day="${day}">Pausar</button>`}</div></div>`;
  h+=`<div class="progress" role="img" aria-label="${okSets} de ${allSets} séries"><i style="width:${allSets?okSets/allSets*100:0}%"></i></div>`;
  h+=`<div class="strip" aria-label="Exercícios do treino"><button type="button" class="wc ${WARM.every(([k])=>d.warm[k])?"done":WARM.some(([k])=>d.warm[k])?"part":""}" data-a="jump" data-to="warm">aquec.</button>${list.map((it,i)=>`<button type="button" class="${exState(d,it)}" data-a="jump" data-to="card-${it.orig}" aria-label="${esc(ex(it.id).n)}">${i+1}</button>`).join("")}<button type="button" class="wc ${d.cardio.ok?"done":""}" data-a="jump" data-to="cardio">cardio</button></div>`;
  h+=`<div class="focus"><span class="sticker">${doneEx}/${list.length} exercícios · ${okSets}/${allSets} séries</span></div>`;
  const wdone=WARM.filter(([k])=>d.warm[k]).length;
  h+=`<article class="paper alt flat tip" id="warm"><span class="tag">aquecimento · ${WARM_MIN} min</span><h3>${wdone>=WARM.length?"Aquecida ✕":"Antes de começar"}</h3>
    ${WARM.map(([k,t])=>`<label class="tog"><input type="checkbox" id="w-${day}-${k}" data-bind="drafts.${day}.warm.${k}" data-rr="1" ${d.warm[k]?"checked":""}> ${esc(t)}</label>`).join("")}
    <p class="sub">Se algum item provocar sintomas, pule.</p></article>`;
  h+=list.map((it,i)=>card(day,it,i,d)).join("");

  if(out.length) h+=`<div class="empty">Não couberam nos ${RESIST_MIN} min sem encurtar o descanso: ${out.map(it=>`<b>${esc(ex(it.id).n)}</b> <button class="mini" type="button" data-a="inc" data-day="${day}" data-id="${it.id}">incluir hoje</button>`).join(" ")}${day!=="D"?" Eles podem ir para o Treino D ou outro dia (aba Plano).":""}</div>`;
  h+=cardioCard(day,d,lb);
  h+=`<button class="big" type="button" data-a="finish" data-day="${day}">Concluir treino ${day}</button>
    <div class="row"><button class="ghost danger" type="button" data-a="discard" data-day="${day}">${S.ui.confirm==="discard"?"Toque de novo para apagar":"Descartar o que anotei"}</button></div>`;
  return h;
}

function finish(day){
  const d=S.drafts[day]; if(!d) return;
  const sets={},rir={},notes={},sym={}; let n=0,vol=0; const prs=[];
  Object.entries(d.sets).forEach(([id,arr])=>{
    const ok=arr.filter(x=>num(x.r)&&(x.ok||num(x.kg)!=null)).map(x=>({kg:x.kg,r:x.r}));
    if(ok.length){
      const prev=sessionsFor(id).map(h=>topKg(h.sets[id])).filter(x=>x!=null), best=prev.length?Math.max(...prev):null, now=topKg(ok);
      if(now!=null&&best!=null&&now>best) prs.push(`${ex(id).n} ${fmt(now)} kg`);
      sets[id]=ok; n+=ok.length; vol+=ok.reduce((a,x)=>a+(num(x.kg)||0)*(isTime(id)?0:num(x.r)),0);
      if(d.rir[id]!=null&&d.rir[id]!=="") rir[id]=d.rir[id];
    }
    if(d.notes[id]) notes[id]=d.notes[id];
  });
  Object.entries(d.sym).forEach(([id,s])=>{if(s.saved)sym[id]={dor:num(s.dor)||0,irr:!!s.irr,nota:s.nota||""}});
  if(!n&&!d.cardio.ok){finished={t:"Nada para salvar",m:"Nenhuma série com repetições anotadas. Preencha as reps e marque ✕ nas séries feitas."};return}
  const dur=Math.round(elapsed(d)/60000);
  const cardio=(d.cardio.ok||d.cardio.adapt)?Object.assign({},d.cardio):null;
  S.history.push({id:Date.now(),date:d.date,day,sets,rir,notes,sym,swap:d.swap,skip:Object.keys(d.skip).filter(k=>d.skip[k]),warm:WARM.filter(([k])=>d.warm[k]).length,cardio,dur:dur||null});
  delete S.drafts[day];
  finished={t:"Treino salvo!",m:`${n} séries · ${Math.round(vol).toLocaleString("pt-BR")} kg levantados${dur?` · ${dur} min`:""}.${prs.length?` Recorde: ${prs.join(", ")}.`:""}${Object.keys(sym).length?" Os sintomas registrados ficam no histórico do exercício.":""}`};
  save(true); reWake(); window.scrollTo(0,0);
}

function weekWarnings(){
  const w=[], wk=S.week, idx=d=>wk.map((x,i)=>x===d?i:-1).filter(i=>i>=0);
  const extra=wk.filter(x=>["pilates","cardio","recup"].includes(x)).length;
  if(extra>2) w.push(`${extra} dias de pilates/cardio/recuperação; o combinado era até 2.`);
  const a=idx("A"),c=idx("C");
  if(a.some(i=>c.some(j=>Math.abs(i-j)===1||Math.abs(i-j)===6))) w.push("Treinos A e C em dias seguidos: o glúteo fica sem descanso entre eles.");
  ["A","B","C"].forEach(d=>{if(!wk.includes(d))w.push(`Treino ${d} não está na agenda.`)});
  const pv=planVolume(), zero=Object.keys(SUB).filter(g=>pv[g]<=0);
  if(zero.length) w.push(`Sem estímulo planejado: ${zero.map(g=>SUB[g].n).join(", ")}.`);
  const low=Object.keys(SUB).filter(g=>pv[g]>0&&stateOf(g,pv[g])===1);
  if(low.length) w.push(`Volume planejado abaixo da faixa: ${low.map(g=>SUB[g].n).join(", ")}.`);
  return w.length?`<div class="empty" style="color:var(--tape);border-color:var(--tape)">${w.map(esc).join("<br>")}</div>`:"";
}
function volBars(v){

    S.plan[slot].ex.forEach((it,k)=>{if(!b.fit.has(k))return;planned++;
      const hit=sess.some(h=>h.day===slot&&(h.sets[it.id]||(h.swap&&h.swap[it.id]&&h.sets[h.swap[it.id]])));

}

function detectEx(t){let best=null,score=0;Object.keys(EX).forEach(k=>{const words=norm(ex(k).n).split(/[^a-z0-9]+/).filter(w=>w.length>3);const s=words.filter(w=>t.includes(w)).length/(words.length||1)+(t.includes(norm(ex(k).n))?1:0);if(s>score){score=s;best=k}});return score>=.3?best:null}
function routeAsk(txt){
  const t=norm(txt), id=detectEx(t), has=(...w)=>w.some(x=>t.includes(x));

  else if(has("no lugar","alternativ","substitu","trocar")) q="alt";
  else if(has("maquina","academia","aparelho")) q="gym";
  else if(has("42","distribu","minuto","tempo")) q="time";
  else if(has("evolu","progred","melhorando")) q="prog";
  else if(has("ultimo","ultima","desempenho","quanto fiz")) q="last";
  else if(has("musculo","preciso trabalhar","faltando","grupo")) q="missing";
  else if(id) q="last";
  S.ui.q=q; S.ui.askMiss=!q; if(id) S.ui.qEx=id;

  if(c) out.push(card2("comida","",`${Math.round(c.kcal)} kcal · ${Math.round(c.prot[0])}–${Math.round(c.prot[1])} g de proteína`,`<ul><li>Divida a proteína em 3–5 refeições de 25–40 g.</li><li>Carboidrato antes do treino para render nas séries.</li><li>${fmt(c.agua/1000)} L de água por dia.</li><li>${p.objetivo==="definir"?"Perda de 0,3–0,7 kg por semana protege o músculo.":p.objetivo==="ganhar"?"Ganho de 0,2–0,4 kg por mês evita acumular gordura.":"Na recomposição o peso muda pouco: acompanhe medidas e fotos."}</li></ul>`));
  else out.push(card2("perfil","pri","Falta a altura",`<p>Em Mais → Perfil, coloque sua altura para calcular calorias, proteína e água.</p>`));
  out.push(card2("estética","","Físico proporcional",`<ul><li><b>Prioridades:</b> glúteo máximo e médio, ombro lateral, costas e posteriores desenham a silhueta.</li><li><b>Intensidade:</b> termine as séries com 1–2 reps sobrando. Marque o RIR para o app decidir melhor quando subir carga.</li><li><b>Semana leve</b> a cada 6–8 semanas (metade das séries).</li><li><b>Sono:</b> 7–9 h.</li><li><b>Fotos</b> e medidas a cada 4 semanas valem mais que o espelho.</li></ul>`));
  out.push(card2("seu plano","","Por que o plano mudou",`<ul><li>Sessões de 60 min: 8 aquecimento + 42 musculação + 10 cardio. O que não cabe vai para o D.</li><li>Saíram do padrão: stiff com barra, hiperextensão, elevação de pernas e agachamento livre (alta exigência lombar). Continuam na biblioteca se seu profissional liberar.</li><li>Remada com apoio no peito e desenvolvimento sentado com encosto no lugar das versões sem apoio.</li><li>Glúteo em A e C; costas e ombros no B.</li></ul>`));
  return out.join("");
}
function calc(){
  const p=S.profile, w=num(p.peso), h=num(p.altura), a=num(p.idade);
  if(!w||!h||!a) return null;
  const bmr=10*w+6.25*h-5*a-161, gymDays=S.week.filter(x=>GYM.includes(x)).length, other=S.week.filter(x=>["pilates","cardio","recup"].includes(x)).length;
  const tdee=bmr*(1.2+0.075*gymDays+0.05*other), adj={definir:.82,recomp:.95,ganhar:1.08}[p.objetivo]||.95;
  return {imc:w/((h/100)**2),bmr,tdee,kcal:tdee*adj,prot:[w*1.6,w*2.2],agua:w*35};
}

    case "ck":S.ui.ck[b.dataset.k]=b.dataset.v==="1";break;
    case "ckNone":{const keep=S.ui.ck||{};S.ui.ck=Object.assign(blankCk(),{sono:keep.sono||"",dorMusc:keep.dorMusc||""})}/* segue para salvar */
    case "ckSave":{const f=clone(S.ui.ck);f.date=today();f.t=Date.now();f.dor=num(f.dor)||0;S.checkins=S.checkins.filter(c=>c.date!==today());S.checkins.push(f);S.ui.ck=null;S.ui.ckEdit=false;break}
    case "ckEdit":{const c=S.checkins.find(x=>x.date===today());S.ui.ck=c?clone(c):null;S.ui.ckEdit=true;break}
    case "ckCancel":S.ui.ck=null;S.ui.ckEdit=false;break;
    case "addAct":{const m=num($("#actMin").value);if(!m)return;S.acts.push({date:today(),type:$("#actType").value,min:m,rpe:$("#actRpe").value});break}
    case "pday":S.ui.planDay=day;S.ui.planAlt=null;break;
    case "prio":{const it=S.plan[S.ui.planDay].ex[+b.dataset.i];it.prio=it.prio==="c"?"e":"c";break}
    case "pmove":{const Lx=S.plan[S.ui.planDay].ex,i=+b.dataset.i,j=i+ +b.dataset.d;if(j>=0&&j<Lx.length)[Lx[i],Lx[j]]=[Lx[j],Lx[i]];break}
    case "prm":S.plan[S.ui.planDay].ex.splice(+b.dataset.i,1);break;
    case "moveTo":{const Lx=S.plan[S.ui.planDay].ex,it=Lx.splice(+b.dataset.i,1)[0];const T=S.plan[b.dataset.to].ex;if(!T.some(x=>x.id===it.id))T.push(it);break}
    case "planAlt":{const k=S.ui.planDay+b.dataset.i;S.ui.planAlt=S.ui.planAlt===k?null:k;break}
    case "addEx":{const id=$("#addEx").value,pd=S.ui.planDay;if(!S.plan[pd].ex.some(x=>x.id===id))S.plan[pd].ex.push(isTime(id)?P(id,3,30,60,"c"):P(id,3,10,12,"c"));break}
    case "resetPlan":conf("resetPlan",()=>{S.plan=clone(PLAN_V2);S.week=WEEK_V2.slice();S.drafts={}});break;
    case "mapSel":S.ui.mapSel=S.ui.mapSel===b.dataset.g?null:b.dataset.g;break;
    case "exDetail":S.ui.exDetail=b.dataset.id||null;save();render();if(b.dataset.id)window.scrollTo(0,0);return;
    case "mchart":S.ui.mchart=b.dataset.k;break;
    case "month":{const cur=S.ui.month||today().slice(0,7),n=shiftMonth(cur,+b.dataset.v);S.ui.month=n>=today().slice(0,7)?null:n;break}
    case "copyMonth":{const txt=monthText(monthReport(S.ui.month||today().slice(0,7))),el=$("#monthMsg");
      try{navigator.clipboard.writeText(txt).then(()=>{el.textContent="Resumo copiado."},()=>{el.textContent=txt})}catch(e){el.textContent=txt}return}
    case "addMeas":{const f=S.ui.mf||{};const rec={d:f.d||today()};let any=false;MEAS.forEach(([k])=>{if(num(f[k])!=null){rec[k]=String(num(f[k]));any=true}});if(!any)return;
      const old=S.measures.find(m=>m.d===rec.d);if(old)Object.assign(old,rec);else S.measures.push(rec);if(rec.peso&&rec.d>=today())S.profile.peso=rec.peso;S.ui.mf={d:today()};break}
    case "delMeas":conf("m"+b.dataset.d,()=>{S.measures=S.measures.filter(m=>m.d!==b.dataset.d)});break;
    case "pose":S.ui.pose=b.dataset.k;S.ui.phA=null;S.ui.phB=null;break;
    case "delPhoto":{const [pose,d]=b.dataset.k.split("|");if(S.ui.confirm==="ph"+pose+d){S.ui.confirm=null;phDel(`prog-${pose}-${d}`).then(rerender)}else S.ui.confirm="ph"+pose+d;break}
    case "delHist":conf("h"+b.dataset.id,()=>{S.history=S.history.filter(h=>String(h.id)!==b.dataset.id)});break;
    case "q":S.ui.q=S.ui.q===b.dataset.k?null:b.dataset.k;S.ui.askMiss=false;break;
    case "ask":routeAsk($("#askTxt").value);break;
    case "mais":S.ui.mais=b.dataset.k;break;
    case "addRec":{const t=$("#rec-t").value.trim();if(!t)return;S.profile.recs.push({text:t,who:$("#rec-w").value,date:$("#rec-d").value||today()});break}
    case "delRec":conf("r"+b.dataset.i,()=>{S.profile.recs.splice(+b.dataset.i,1)});break;
    case "gym":S.gym[b.dataset.k]=b.dataset.v;break;
    case "addEq":{const n=$("#neweq").value.trim();if(!n)return;const k="ceq_"+Date.now();S.customEq[k]=n;S.gym[k]="sim";break}
    case "libEx":S.ui.libEx=b.dataset.id||null;save();render();if(b.dataset.id)window.scrollTo(0,0);return;
    case "addCx":{const n=$("#cx-n").value.trim();if(!n)return;const g=$("#cx-g").value,g2=$("#cx-g2").value,w={[g]:1};if(g2&&g2!==g)w[g2]=.5;
      const id="cx_"+Date.now(),o=X(n,$("#cx-en").value.trim()||n,[$("#cx-eq").value],w,"raise",num($("#cx-r").value)||60,+$("#cx-l").value,"Exercício criado por você; a exigência lombar foi marcada por você.",[],[],$("#cx-tip").value.trim());
      if($("#cx-t").value)o.t=$("#cx-t").value;if($("#cx-u").checked)o.uni=1;S.customEx[id]=o;EX[id]=o;S.ui.libEx=id;break}
    case "delCx":conf("cx"+b.dataset.id,()=>{const id=b.dataset.id,inUse=GYM.some(d=>S.plan[d].ex.some(x=>x.id===id))||S.history.some(h=>h.sets&&h.sets[id]);
      if(inUse){finished={t:"Não apagado",m:"Esse exercício está no plano ou no histórico. Tire do plano antes; o histórico é mantido."};S.ui.tab="treino";return}
      delete S.customEx[id];delete EX[id];S.ui.libEx=null});break;
    case "resetTargets":Object.entries(SUB).forEach(([k,v])=>S.targets[k]={lo:v.lo,hi:v.hi});break;
    case "copyJson":copy(JSON.stringify(Object.assign({},S,{ui:undefined})),"Backup copiado. Cole nas Notas para guardar.");return;
    case "copyCsv":{const rows=[["data","treino","exercicio","exercise","musculo_principal","serie","kg","reps_ou_seg","rir_ultima_serie","observacao"]];
      [...S.history].sort((x,y)=>x.date<y.date?-1:1).forEach(h=>Object.entries(h.sets||{}).forEach(([id,s])=>s.forEach((x,i)=>rows.push([h.date,h.day,ex(id).n,ex(id).en,primSubs(id).map(g=>SUB[g].n).join(" / "),i+1,x.kg,x.r,i===s.length-1&&h.rir?(h.rir[id]??""):"",i===0?((h.notes||{})[id]||""):""]))));
      S.acts.forEach(x=>rows.push([x.date,actName(x.type),"","","","","",x.min+" min","",""]));
      copy(rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"CSV copiado. Cole no Google Planilhas ou Excel.");return}
    case "restore":restore($("#backupBox").value);return;
  }
  save(true);rerender();
});
function copy(text,msg){
  const box=$("#backupBox");box.value=text;
  const done=m=>{const el=$("#bkMsg");if(el)el.textContent=m};
  try{navigator.clipboard.writeText(text).then(()=>done(msg),()=>{box.select();done("Texto selecionado abaixo: toque em Copiar.")})}
  catch(e){box.select();done("Texto selecionado abaixo: toque em Copiar.")}
}
function restore(txt){
  try{const d=JSON.parse(txt);if(!d||!d.plan||!d.history)throw 0;try{localStorage.setItem(KEY+"-antes-restaurar",JSON.stringify(S))}catch(e){}
    S=migrate(d);S.ui=Object.assign(fresh().ui,{tab:"mais",mais:"ajustes"});Object.assign(EX,S.customEx||{});save(true);render();const el=$("#bkMsg");if(el)el.textContent="Backup restaurado."}
  catch(e){const el=$("#bkMsg");if(el)el.textContent="Esse texto não é um backup válido deste app."}
}

/* modo offline quando instalado como app (não roda dentro do claude.ai) */
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}

save(true);
render();
phAll().then(r=>{PH=r;if(r.length)rerender()});
</script>
