<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Destrava">

<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Destrava</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=UnifrakturCook:wght@700&display=swap">
</head><body>
<style>
/* Layout: caderno emo/scene — fundo preto xadrez, cartões pretos com borda rosa e roxa, estrelas e corações de adesivo,
   título em letra gótica com brilho. Tema escuro fixo, de propósito. Feito para TDAH: uma coisa grande por vez. */
:root{
  --ink:#0b0a0f; --ink2:#17141f; --ink3:#211c2c; --line:#352f44;
  --pink:#ff3ea5; --purple:#a35cff; --lilac:#d7b8ff; --cyan:#5ef0ff; --fg:#f5f0ff; --dim:#9a90b0; --ok:#7dffb0; --warn:#ffd23e;
  --f-goth:"UnifrakturCook","Old English Text MT",Georgia,serif;
  --f-display:"Anton","HelveticaNeue-CondensedBlack","Futura-CondensedExtraBold",Impact,"Arial Narrow",sans-serif;
  --f-type:"Special Elite","American Typewriter","Courier New",monospace;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:repeating-conic-gradient(rgba(255,255,255,.035) 0 25%,transparent 0 50%);background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

/* topo */
.top{padding-block:20px 6px;display:grid;gap:4px;position:relative}
.logo{font-family:var(--f-goth);font-size:clamp(48px,16vw,80px);line-height:.95;color:var(--pink);text-shadow:0 0 18px rgba(255,62,165,.55),3px 3px 0 var(--purple);letter-spacing:.01em}
.logo small{font-family:var(--f-type);font-size:14px;color:var(--lilac);text-shadow:none;letter-spacing:.06em;margin-left:6px}
.stk{position:absolute;pointer-events:none}
.stk.s1{right:6px;top:18px;width:46px;transform:rotate(14deg)}
.stk.s2{right:4px;top:74px;width:24px;transform:rotate(-12deg)}
.hello{font-family:var(--f-type);color:var(--dim);font-size:14px}
.hello b{color:var(--lilac);font-weight:400}
.warn{font-family:var(--f-type);font-size:13px;background:var(--warn);color:var(--ink);padding:6px 10px}

/* captura rápida */
.cap{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;padding-block:10px 8px;background:linear-gradient(var(--ink) 75%,transparent)}
.cap form{display:flex;gap:6px}
.cap input{flex:1;min-width:0;background:var(--ink2);border:2px solid var(--pink);border-radius:0;padding:12px;font-size:16px;color:var(--fg);box-shadow:3px 3px 0 var(--purple)}
.cap input::placeholder{color:var(--dim)}
.cap button{flex:0 0 auto;width:52px;border:2px solid var(--pink);background:var(--pink);color:var(--ink);font-family:var(--f-display);font-size:26px;line-height:1}
.parsed{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);border-top:3px solid var(--pink);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
  background-image:linear-gradient(90deg,transparent 0 0);}
nav.tabs button{background:none;border:0;padding:10px 2px 8px;font-family:var(--f-display);font-size:14px;letter-spacing:.04em;color:var(--dim);text-transform:uppercase;min-width:0}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--pink);box-shadow:3px 3px 0 var(--purple)}

section{display:flex;flex-direction:column;gap:16px;padding-block:6px}
.label{font-family:var(--f-display);font-size:21px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.label::before{content:"✦";color:var(--pink);font-size:16px}
.label::after{content:"";flex:1;height:10px;background:repeating-conic-gradient(var(--fg) 0 25%,transparent 0 50%) 0 0/10px 10px;opacity:.35}
.sub{font-family:var(--f-type);color:var(--dim);font-size:13px;margin:0}

/* cartões */
.box{position:relative;background:var(--ink2);border:2px solid var(--pink);padding:16px 14px 14px;box-shadow:5px 5px 0 var(--purple)}
.box.p{border-color:var(--purple);box-shadow:5px 5px 0 var(--pink)}
.box.c{border-color:var(--cyan);box-shadow:5px 5px 0 var(--purple)}
.box h3{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.box .pin{position:absolute;top:-12px;right:14px;width:30px;transform:rotate(18deg)}
.chk{height:12px;margin:-16px -14px 12px;background:repeating-conic-gradient(var(--pink) 0 25%,var(--ink) 0 50%) 0 0/12px 12px}
.box.p .chk{background:repeating-conic-gradient(var(--purple) 0 25%,var(--ink) 0 50%) 0 0/12px 12px}

/* energia */
.energy{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.energy span{font-family:var(--f-type);font-size:12.5px;color:var(--dim)}
.energy button{border:2px solid var(--line);background:var(--ink2);padding:8px 4px;font-family:var(--f-display);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);display:flex;gap:6px;align-items:center;justify-content:center}
.energy button[aria-pressed="true"]{border-color:var(--cyan);color:var(--fg);background:var(--ink3)}
.batt{display:inline-flex;gap:2px;border:2px solid currentColor;padding:2px;height:16px}
.batt i{width:5px;background:currentColor;opacity:.25}
.batt i.on{opacity:1}

/* 3 de hoje */
.three{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:2px dashed var(--line);padding:8px;min-height:64px}
.slot.full{border-style:solid;border-color:var(--lilac);background:var(--ink3)}
.slot.done{border-color:var(--ok)}
.slot .n{font-family:var(--f-goth);font-size:36px;color:var(--pink);text-align:center;line-height:1}
.slot .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.slot .t small{display:block;font-weight:400;font-family:var(--f-type);font-size:12px;color:var(--dim)}
.slot.done .t{text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:3px}

.ck{width:46px;height:46px;flex:0 0 46px;border:2px solid var(--fg);background:transparent;color:var(--ink);font-family:var(--f-display);font-size:22px;display:grid;place-items:center}
.ck.on{background:var(--pink);border-color:var(--pink)}
.ck svg{width:26px;height:26px}

.bigbtn{display:block;width:100%;border:3px solid var(--fg);background:var(--pink);color:var(--ink);font-family:var(--f-display);font-size:28px;letter-spacing:.06em;padding:14px;text-transform:uppercase;box-shadow:5px 5px 0 var(--purple);position:relative}
.bigbtn small{display:block;font-family:var(--f-type);font-size:12.5px;letter-spacing:0;text-transform:none}
.bigbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--purple)}
.bigbtn.alt{background:var(--purple);color:var(--fg);box-shadow:5px 5px 0 var(--pink)}
.ghost{background:transparent;border:2px solid var(--fg);padding:8px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.ghost.pk{border-color:var(--pink);color:var(--pink)}
.ghost.on{background:var(--fg);color:var(--ink)}
.mini{background:transparent;border:1.5px solid currentColor;padding:6px 9px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.mini.on{background:var(--fg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:transparent;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--pink);background:var(--pink);color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border:1.5px solid var(--line);color:var(--lilac)}
.tag.casa{border-color:var(--pink);color:var(--pink)} .tag.trab{border-color:var(--cyan);color:var(--cyan)}
.tag.late{background:var(--warn);color:var(--ink);border-color:var(--warn)}
.tag.pr{background:var(--pink);color:var(--ink);border-color:var(--pink)}

/* linha do tempo */
.tl{position:relative;display:grid;gap:0;border-left:3px solid var(--line);margin-left:52px}
.tli{position:relative;padding:6px 0 6px 14px;min-height:34px}
.tli .h{position:absolute;left:-56px;top:7px;width:46px;text-align:right;font-family:var(--f-type);font-size:12px;color:var(--dim)}
.tli .dot{position:absolute;left:-9px;top:12px;width:15px;height:15px;border:3px solid var(--ink);background:var(--purple);transform:rotate(45deg)}
.tli.ev .dot{background:var(--cyan)} .tli.task .dot{background:var(--pink)} .tli.ext .dot{background:var(--lilac)}
.tli .card{border:2px solid var(--line);background:var(--ink2);padding:8px 10px;display:grid;gap:2px}
.tli.ev .card{border-color:var(--cyan)} .tli.task .card{border-color:var(--pink)}
.tli .card b{font-size:14.5px}
.tli .card small{font-family:var(--f-type);font-size:12px;color:var(--dim)}
.tli.gap .card{border-style:dashed;background:transparent}
.tli.gap .card b{font-family:var(--f-type);font-weight:400;font-size:13px;color:var(--ok)}
.tli.past{opacity:.45}
.now{position:relative;height:0;border-top:3px solid var(--pink);margin:4px 0 4px -3px}
.now span{position:absolute;left:-56px;top:-10px;width:46px;text-align:right;font-family:var(--f-display);font-size:13px;color:var(--pink)}

/* lista */
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;border:2px solid var(--line);background:var(--ink2);padding:10px}
.task.open{border-color:var(--lilac)}
.task .tt{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.task .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.task .more{grid-column:1/-1;display:grid;gap:8px;border-top:2px dashed var(--line);padding-top:8px}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px;color:var(--dim)}
.steps{display:grid;gap:4px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 30px;gap:8px;align-items:center}
.step .ck{width:34px;height:34px;flex-basis:34px;font-size:16px}
.step .ck svg{width:18px;height:18px}
.step span{font-size:14px;overflow-wrap:anywhere}
.step.ok span{text-decoration:line-through;color:var(--dim)}
.step .x{width:30px;height:30px;border:0;background:transparent;color:var(--dim);font-size:18px}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--f-type);font-size:12px;color:var(--dim)}
.form .full{grid-column:1/-1}
.dk,.form input,.form select,textarea{background:var(--ink);border:2px solid var(--line);padding:10px;font-size:16px;color:var(--fg);border-radius:0;width:100%;min-width:0}
textarea{font-family:var(--f-type);font-size:12px;min-height:100px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inline>*{flex:1 1 120px}
.inline>button{flex:0 0 auto}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{border:2px solid var(--line);background:var(--ink2);padding:6px 0;color:var(--fg);display:grid;gap:2px;justify-items:center;min-width:0}
.week button b{font-family:var(--f-display);font-weight:400;font-size:18px}
.week button small{font-family:var(--f-type);font-size:10.5px;color:var(--dim)}
.week button i{display:flex;gap:2px;height:6px}
.week button i u{width:6px;height:6px;background:var(--cyan)} .week button i s{width:6px;height:6px;background:var(--pink)}
.week button[aria-pressed="true"]{border-color:var(--pink);background:var(--ink3)}
.week button.today b{color:var(--pink)}

/* foco */
.focus{display:grid;gap:14px;justify-items:center;text-align:center}
.focus h2{font-family:var(--f-display);font-size:30px;text-transform:uppercase;line-height:1.05}
.ring{width:min(260px,70vw);aspect-ratio:1;max-width:100%;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:54px;color:var(--fg)}
.ring .tm small{display:block;font-family:var(--f-type);font-size:13px;color:var(--dim)}
.curstep{border:2px solid var(--pink);padding:12px;background:var(--ink2);width:100%;font-size:17px;font-weight:700}
.curstep small{display:block;font-family:var(--f-type);font-weight:400;font-size:12px;color:var(--dim)}
.pep{font-family:var(--f-type);color:var(--lilac);font-size:14px;min-height:20px}

/* vitórias */
.wins{display:flex;flex-wrap:wrap;gap:6px}
.win{border:1.5px solid var(--ok);color:var(--ok);font-size:12.5px;padding:3px 8px}
.stickers{display:flex;flex-wrap:wrap;gap:10px}
.stickers svg{width:46px;height:46px}
.stickers .lock{opacity:.18;filter:grayscale(1)}
.xp{display:grid;gap:6px}
.xpbar{height:16px;border:2px solid var(--fg);position:relative;background:repeating-conic-gradient(rgba(255,255,255,.06) 0 25%,transparent 0 50%) 0 0/8px 8px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--purple),var(--pink))}

.integ{display:grid;gap:6px}
.integ a,.integ div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:2px solid var(--line);padding:8px 10px;color:var(--fg);text-decoration:none;font-size:14px}
.integ b{font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--ink);padding:2px 6px;text-transform:uppercase}
.empty{font-family:var(--f-type);color:var(--dim);border:2px dashed var(--line);padding:12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--ink);padding:10px 14px;font-weight:700;box-shadow:4px 4px 0 var(--pink);max-width:calc(100% - 32px);text-align:center}
.burst{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.burst i{position:absolute;width:22px;height:22px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}}
details.fold{border:2px solid var(--line)}
details.fold>summary{cursor:pointer;padding:12px;font-family:var(--f-display);font-size:18px;letter-spacing:.05em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"✦";color:var(--pink)}
details.fold>div{padding:0 12px 14px;display:grid;gap:10px}
ol.how{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.tog{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.tog input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--pink);margin:0}
</style>

<div class="wrap">
  <div class="top">
    <h1 class="logo" id="logo">Destrava<small>da Bia</small></h1>
    <svg class="stk s1" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 36 4 19C-1 12 4 3 12 4c4 0 6 3 8 6 2-3 4-6 8-6 8-1 13 8 8 15Z" fill="#ff3ea5" stroke="#0b0a0f" stroke-width="2.5"/><path d="M22 8 17 18h6l-5 11" fill="none" stroke="#0b0a0f" stroke-width="2.5"/></svg>
    <svg class="stk s2" viewBox="0 0 40 40" aria-hidden="true"><path d="m20 2 5 13 13 1-10 9 3 13-11-7-11 7 3-13L2 16l13-1Z" fill="#a35cff" stroke="#0b0a0f" stroke-width="2"/></svg>
    <div class="hello" id="hello"></div>
    <div class="warn" id="storeWarn" hidden>Este navegador não está guardando dados. Use o backup (aba Mais).</div>
  </div>
  <div class="cap"><form id="capForm" autocomplete="off"><input id="capIn" placeholder="despeja aqui: consertar chuveiro amanhã 30min" aria-label="Anotar uma coisa"><button type="submit" aria-label="Guardar">+</button></form><div class="parsed" id="parsed"></div></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="hoje">Hoje</button>
  <button type="button" data-tab="agenda">Agenda</button>
  <button type="button" data-tab="tudo">Tudo</button>
  <button type="button" data-tab="foco">Foco</button>
  <button type="button" data-tab="mais">Mais</button>
</nav>

<script>
/* =====================================================================
   CONSTANTES
   ===================================================================== */
const TIPOS={arrumar:"Arrumar",consertar:"Consertar",comprar:"Comprar",limpar:"Limpar",resolver:"Resolver",trabalho:"Trabalho",outro:"Outro"};
const STEP_TPL={
  arrumar:["Pegar um saco de lixo e uma caixa","5 min: só tirar o que é lixo","Separar o que vai doar","Guardar o resto no lugar"],

};
const DOWN=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const DOWL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const PEP=["Começar é a parte mais difícil. Já foi.","Feito é melhor que perfeito.","Só esse passo. O resto espera.","Pode ser mal feito. Ainda conta.","Ninguém está olhando. Só faz.","Se travar, quebra em um passo menor.","Você já fez coisa mais difícil que isso."];
const LIMPEZA_DEF={1:{z:"Banheiro",l:["Vaso e pia","Espelho","Chão","Trocar toalhas"]},2:{z:"Cozinha",l:["Fogão","Bancada","Lixo","Pano de prato"]},3:{z:"Quarto",l:["Trocar lençol","Tirar pó","Roupas no lugar","Chão"]},4:{z:"Sala",l:["Tirar pó","Almofadas e manta","Chão","Superfícies livres"]},5:{z:"Área de serviço",l:["Lavar roupa","Estender ou secar","Guardar roupa"]},6:{z:"Geladeira e plantas",l:["Jogar fora o vencido","Limpar uma prateleira","Regar plantas"]},0:{z:"Descanso",l:[]}};
const ROT_DEF={manha:["Beber um copo de água","Remédios e suplementos","Arrumar a cama","Ver as 3 de hoje"],noite:["Lavar a louça do dia","Separar roupa de amanhã","Escolher as 3 de amanhã","Celular carregando longe da cama"]};
const STICKERS=[["coração",'<path d="M20 36 4 19C-1 12 4 3 12 4c4 0 6 3 8 6 2-3 4-6 8-6 8-1 13 8 8 15Z" fill="#ff3ea5" stroke="#f5f0ff" stroke-width="2"/>'],

const KW={consertar:/conserta|arruma[r]? o |troca[r]? (a |o )?(lampada|resistencia|torneira|chuveiro)|quebr|vazamento|pintar|instalar/,arrumar:/arruma|organiza|guarda|separa|dobra|desapeg/,comprar:/compra|pedir|encomenda/,limpar:/limpa|lava|varre|faxina|passa pano|aspira/,resolver:/liga[r]? |marca[r]? |pagar|banco|cartorio|documento|agendar|cancelar|renovar|inss|detran|receita|boleto|responder|devolver/,trabalho:/reuniao|relatorio|cliente|entrega|apresenta|planilha|e-?mail|projeto|proposta|call|deadline|trabalho|chefe|equipe/};
const WORK=/reuniao|relatorio|cliente|entrega|apresenta|planilha|e-?mail|projeto|proposta|call|deadline|trabalho|chefe|equipe|#trab/;
const EVENTY=/reuniao|consulta|medic[oa]|dentista|exame|aula|call|entrevista|aniversario|encontro|jantar com|almoco com|voo|viagem/;
function parseCap(raw){
  let s=" "+raw+" ", t=norm(s), out={t:raw.trim(),tipo:"outro",area:"casa",min:15,date:null,time:null,event:false,prio:false};
  const cut=re=>{const m=s.match(re);if(m){s=s.replace(m[0]," ");t=norm(s)}return m};
  let m;
  if((m=cut(/\s#?(trab(alho)?)\b/i)))out.area="trab";
  if((m=cut(/\s#casa\b/i)))out.area="casa";
  if((m=cut(/\s!+|\s(urgente)\b/i)))out.prio=true;
  if((m=cut(/\s(\d{1,3})\s?(min|m)\b/i)))out.min=+m[1];
  else if((m=cut(/\s(\d)\s?(horas?|hrs?)\b/i)))out.min=+m[1]*60;
  if((m=cut(/\s(?:as|às)?\s?(\d{1,2})(?:h|:)(\d{2})?\b/i))){out.time=`${pad(+m[1])}:${m[2]||"00"}`}
  if((m=cut(/\s(hoje)\b/i)))out.date=today();
  else if((m=cut(/\s(depois de amanh[ãa])(?=\s|$)/i)))out.date=addDays(today(),2);
  else if((m=cut(/\s(amanh[ãa])(?=\s|$)/i)))out.date=addDays(today(),1);
  else if((m=cut(/\s(?:na |no |dia )?(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(-feira)?\b/i))){const i=["domingo","segunda","terca","quarta","quinta","sexta","sabado"].indexOf(norm(m[1]));let k=(i-new Date().getDay()+7)%7||7;out.date=addDays(today(),k)}
  else if((m=cut(/\s(?:dia )?(\d{1,2})\/(\d{1,2})\b/))){const y=new Date().getFullYear();let d=`${y}-${pad(+m[2])}-${pad(+m[1])}`;if(d<today())d=`${y+1}-${pad(+m[2])}-${pad(+m[1])}`;out.date=d}
  const tn=norm(raw);
  for(const [k,re] of Object.entries(KW)){if(re.test(" "+tn+" ")){out.tipo=k;break}}
  if(out.area!=="trab"&&WORK.test(tn))out.area="trab";
  if(out.tipo==="trabalho")out.area="trab";
  if(out.time&&EVENTY.test(tn))out.event=true;
  out.t=s.replace(/\s{2,}/g," ").trim()||raw.trim();
  out.t=out.t.charAt(0).toUpperCase()+out.t.slice(1);
  return out;
}
function addFromCap(raw){
  const p=parseCap(raw); if(!p.t) return null;
  if(p.event){const e={id:uid(),t:p.t,date:p.date||today(),start:p.time,end:toH(toMin(p.time)+Math.max(30,p.min)),area:p.area,remind:15};S.events.push(e);return {kind:"event",obj:e,p}}
  const t={id:uid(),t:p.t,tipo:p.tipo,area:p.area,min:p.min,energy:p.min>=60?3:p.min<=5?1:2,when:p.date,time:p.time,due:null,steps:[],prio:p.prio,created:today(),done:null,someday:false};
  S.tasks.push(t);return {kind:"task",obj:t,p};
}

function integrations(date){
  const out=[], di=(dow(date)+6)%7, ym=date.slice(0,7);
  const tr=readApp("treino-biazinha-v1");
  if(tr&&tr.week&&tr.plan){const s=tr.week[di];if(tr.plan[s])out.push({k:"treino",c:"var(--pink)",t:`Treino ${s}: ${tr.plan[s].nome}`,href:"../"});else if(s&&s!=="livre"&&s!=="descanso")out.push({k:"treino",c:"var(--pink)",t:s==="pilates"?"Pilates":s==="cardio"?"Cardio":s==="recup"?"Recuperação":s,href:"../"})}

    (gr.recur||[]).filter(r=>r.kind==="out"&&!r.card&&ym>=r.start&&(!r.months||mdiff(r.start,ym)<r.months)&&(!r.end||ym<=r.end)).forEach(r=>{const d=`${ym}-${pad(Math.min(r.day||1,md(y,mo)))}`,dd=Math.round((new Date(d+"T12:00")-new Date(date+"T12:00"))/864e5);if(!(gr.paid||{})[`${r.id}|${ym}`]&&dd>=0&&dd<=3)soon.push(`${r.desc} (${dd===0?"hoje":dmy(d)})`)});
    (gr.cards||[]).forEach(c=>{const d=`${ym}-${pad(Math.min(c.venc||1,md(y,mo)))}`,dd=Math.round((new Date(d+"T12:00")-new Date(date+"T12:00"))/864e5);if(!(gr.fat||{})[`${c.id}|${ym}`]&&dd>=0&&dd<=3&&(gr.tx||[]).some(t=>t.card===c.id&&t.fatura===ym))soon.push(`fatura ${c.n} (${dd===0?"hoje":dmy(d)})`)});
    if(soon.length)out.push({k:"bia$",c:"var(--warn)",t:`Vence: ${soon.join(", ")}`,href:"../grana/"})}
  return out;
}

function freeNow(){const n=nowMin(),evs=S.events.filter(e=>e.date===today()&&e.start).map(e=>toMin(e.start)).filter(x=>x>n).sort((a,b)=>a-b);return evs.length?evs[0]-n:toMin(S.settings.sleepH)-n}
function pickOne(maxMin){
  const t0=today(), E=S.energy, L=S.tasks.filter(t=>open(t)&&(!t.when||t.when<=t0)&&t.energy<=E+0&&t.min<=(maxMin||999));
  const pool=L.length?L:S.tasks.filter(t=>open(t)&&(!t.when||t.when<=t0));
  if(!pool.length) return null;
  const score=t=>(t.prio?50:0)+(S.three[t0]||[]).includes(t.id)*40+(t.due?Math.max(0,30-dDays(t.due)*5):0)+(t.when&&t.when<t0?15:0)+(t.when===t0?20:0)+Math.min(20,dDays(t.created,true))+(t.min<=15?8:0);
  const top=pool.map(t=>({t,s:score(t)})).sort((a,b)=>b.s-a.s).slice(0,3);
  return top[Math.floor(Math.random()*top.length)].t;
}
function dDays(d,past){const x=Math.round((new Date(d+"T12:00")-new Date(today()+"T12:00"))/864e5);return past?-x:x}

function icsDate(d,h){return d.replace(/-/g,"")+"T"+(h||"09:00").replace(":","")+"00"}
function ics(items){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Destrava//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  items.forEach(it=>{L.push("BEGIN:VEVENT",`UID:${it.id}@destrava`,`DTSTAMP:${icsDate(today(),"00:00")}`,`DTSTART:${icsDate(it.date,it.start)}`,`DTEND:${icsDate(it.date,it.end||toH(toMin(it.start||"09:00")+30))}`,`SUMMARY:${String(it.t).replace(/[,;\\]/g," ")}`,`DESCRIPTION:Destrava`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${String(it.t).replace(/[,;\\]/g," ")}`,`TRIGGER:-PT${it.remind||0}M`,"END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n");
}
function sendToCalendar(items){
  const txt=ics(items), blob=new Blob([txt],{type:"text/calendar"}), url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=(items.length>1?"destrava-semana":"lembrete")+".ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);

  const t=today(), cur=S.three[t]||[];
  const L=S.tasks.filter(x=>open(x)&&!cur.includes(x.id)).sort((a,b)=>(b.prio-a.prio)||((a.when||"9")>(b.when||"9")?1:-1)).slice(0,12);
  return `<div style="margin-top:10px;display:grid;gap:6px"><p class="sub">Escolha uma (ou escreva uma nova no topo):</p>${L.length?L.map(x=>`<button class="chip" type="button" data-a="set3" data-id="${x.id}" style="text-align:left">${esc(x.t)} · ${durTxt(x.min)}${x.when&&x.when<t?" · atrasada":""}</button>`).join(""):`<div class="empty">Nada na lista ainda. Despeja no campo lá em cima.</div>`}<button class="mini" type="button" data-a="pick3" data-i="">Fechar</button></div>`;
}
function timeline(date){
  const isToday=date===today(), n=nowMin();
  const it=[];
  S.events.filter(e=>e.date===date).forEach(e=>{const s0=toMin(e.start)??-1;let e0=toMin(e.end);if(e0!=null&&s0>=0&&e0<=s0)e0=Math.min(1440,e0+1440);it.push({k:"ev",s:s0,e:e0,t:e.t,sub:`${e.start||"dia todo"}${e.end?"–"+e.end:""} · ${e.area==="trab"?"trabalho":"pessoal"}`,id:e.id})});
  S.tasks.filter(x=>x.when===date&&x.time&&!x.someday).forEach(x=>it.push({k:"task",s:toMin(x.time),e:toMin(x.time)+x.min,t:x.t,sub:`${x.time} · ${durTxt(x.min)}`,id:x.id,done:x.done}));
  it.sort((a,b)=>a.s-b.s);
  const out=[];let cur=Math.max(toMin(S.settings.wakeH),isToday?Math.ceil(n/15)*15:0);const endDay=toMin(S.settings.sleepH);
  if(!isToday)cur=toMin(S.settings.wakeH);
  let nowPlaced=!isToday;
  const fits=g=>S.tasks.filter(x=>open(x)&&!x.time&&(!x.when||x.when<=date)&&x.min<=g).sort((a,b)=>b.prio-a.prio||b.min-a.min)[0];
  it.forEach(x=>{
    if(!nowPlaced&&x.s>=n){out.push(`<div class="now"><span>${toH(n)}</span></div>`);nowPlaced=true}
    if(x.s>cur+20&&x.s>=0){const g=x.s-cur,f=fits(g);out.push(`<div class="tli gap"><span class="h">${toH(cur)}</span><div class="card"><b>${durTxt(g)} livre${f?` · cabe: ${esc(f.t)}`:""}</b></div></div>`)}
    out.push(`<div class="tli ${x.k} ${isToday&&x.e&&x.e<n?"past":""}"><span class="h">${x.s>=0?toH(x.s):"—"}</span><span class="dot"></span><div class="card"><b>${esc(x.t)}${x.done?" ✓":""}</b><small>${esc(x.sub)}</small></div></div>`);
    if(x.e)cur=Math.max(cur,x.e);
  });
  if(!nowPlaced){out.push(`<div class="now"><span>${toH(n)}</span></div>`)}
  if(endDay-cur>20){const g=endDay-cur,f=fits(Math.min(g,120));out.push(`<div class="tli gap"><span class="h">${toH(cur)}</span><div class="card"><b>${durTxt(g)} livre até ${S.settings.sleepH}${f?` · cabe: ${esc(f.t)}`:""}</b></div></div>`)}
  return it.length||isToday?`<div class="tl">${out.join("")}</div>`:`<div class="empty">Nada marcado.</div>`;
}

let FT={end:0,total:0,int:null,paused:0};

  const t=task(S.ui.focus);
  if(!t||t.done){const p=pickOne(Math.min(freeNow(),180));return `<section class="focus"><h2>Modo foco</h2><p class="sub">Uma coisa, um cronômetro, um passo por vez. A música continua tocando.</p>

    ${S.ui.limp?`<button class="ghost pk" type="button" data-a="limpFocus">Limpeza de 10 min</button>`:""}</section>`}
  const st=t.steps.find(s=>!s.ok), left=FT.end?Math.max(0,Math.round((FT.end-Date.now())/1000)):0, run=FT.end&&!FT.paused;
  const tot=FT.total||t.min*60, frac=FT.end?(FT.paused?FT.paused:left)/tot:1;
  const C=2*Math.PI*45;
  return `<section class="focus">
    <span class="tag ${t.area}">${t.area==="trab"?"trabalho":"casa"} · ${TIPOS[t.tipo]}</span>

      <div class="tm"><div><span id="ftm">${FT.end?clock(FT.paused||left):clock(t.min*60)}</span><small>${run?"focando":FT.paused?"pausado":"pronta?"}</small></div></div></div>
    <div class="row" style="justify-content:center">${run?`<button class="ghost" type="button" data-a="fPause">Pausar</button>`:FT.paused?`<button class="ghost pk" type="button" data-a="fResume">Continuar</button>`:[5,15,25].map(m=>`<button class="ghost ${m===5?"pk":""}" type="button" data-a="fStart" data-v="${m}">${m} min</button>`).join("")}${FT.end?`<button class="ghost" type="button" data-a="fStop">Parar</button>`:""}</div>
    ${st?`<div class="curstep">${esc(st.t)}<small>passo ${t.steps.indexOf(st)+1} de ${t.steps.length}</small></div><button class="bigbtn alt" type="button" data-a="step" data-id="${t.id}" data-i="${t.steps.indexOf(st)}">Fiz esse passo</button>`
      :`<div class="curstep">${t.steps.length?"Todos os passos feitos!":"Qual é o primeiro passo físico? Algo que dá para fazer em 2 minutos."}<small>${t.steps.length?"":"ex.: abrir o arquivo, pegar o saco de lixo, achar o número"}</small></div>`}
    <div class="inline" style="width:100%"><input class="dk" id="fs-new" placeholder="travou? escreve um passo menor"><button class="mini" type="button" data-a="fAddStep" data-id="${t.id}">+</button></div>
    <p class="pep" id="pep">${esc(PEP[Math.floor(Date.now()/60000)%PEP.length])}</p>
    <button class="bigbtn" type="button" data-a="done" data-id="${t.id}">Terminei tudo</button>
    <button class="ghost" type="button" data-a="fLeave">Trocar de tarefa</button>
  </section>`;
}
const clock=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
function ftick(){
  const el=$("#ftm"),arc=$("#arc");if(!FT.end||FT.paused)return;
  const left=Math.max(0,Math.round((FT.end-Date.now())/1000));
  if(el)el.textContent=clock(left);if(arc){const C=2*Math.PI*45;arc.setAttribute("stroke-dashoffset",C*(1-left/FT.total))}
  if(left<=0){clearInterval(FT.int);FT={end:0,total:0,int:null,paused:0};award(5,"Bloco de foco completo");burst();toast("Tempo! Bloco de foco completo. Pausa de 5 min ou mais um?");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}render()}
}

    <p class="sub">Notificação vinda do próprio app, sem passar pelo Calendário, exige um servidor de push. Dá para montar depois com um serviço grátis, se você quiser.</p>`;
  if(sec==="rotinas") b=["manha","noite"].map(k=>`<article class="box ${k==="noite"?"p":""}"><div class="chk"></div><h3>Rotina da ${k==="manha"?"manhã":"noite"}</h3><div class="steps" style="margin-top:8px">${S.rot[k].map((x,i)=>`<div class="step"><span></span><span>${esc(x)}</span><button class="x" type="button" data-a="rmRot" data-k="${k}" data-i="${i}" aria-label="Apagar">×</button></div>`).join("")}</div><div class="inline" style="margin-top:8px"><input class="dk" id="nr-${k}" placeholder="+ item"><button class="mini" type="button" data-a="addRot" data-k="${k}">+</button></div></article>`).join("")+`<p class="sub">Rotina curta funciona melhor. 3 a 5 itens que você faz quase no automático.</p>`;
  if(sec==="limpeza") b=`<p class="sub">Um pedaço da casa por dia, 10 minutos. Sem precisar decidir o que limpar.</p>`+[1,2,3,4,5,6,0].map(d=>{const z=S.limpeza[d];return `<details class="fold"><summary>${DOWL[d]}: ${esc(z.z)}</summary><div><label class="sub">Nome<input class="dk" data-lz="${d}" value="${esc(z.z)}"></label><div class="steps">${z.l.map((x,i)=>`<div class="step"><span></span><span>${esc(x)}</span><button class="x" type="button" data-a="rmLz" data-d="${d}" data-i="${i}" aria-label="Apagar">×</button></div>`).join("")}</div><div class="inline"><input class="dk" id="nl-${d}" placeholder="+ item"><button class="mini" type="button" data-a="addLz" data-d="${d}">+</button></div></div></details>`}).join("");
  if(sec==="conquistas"){const wk=Array.from({length:7},(_,i)=>addDays(today(),i-6)),mx=Math.max(1,...wk.map(d=>(S.log[d]||[]).length));
    const streak=(()=>{let n=0,miss=0;for(let i=0;i<365;i++){const d=addDays(today(),-i);if((S.log[d]||[]).length){n++;miss=0}else if(i===0)continue;else{miss++;if(miss>1)break}}return n})();
    b=`<div class="xp"><span class="sub">nível ${level()} · ${S.xp} pontos</span><div class="xpbar"><i style="width:${S.xp%100}%"></i></div></div>
      <div class="stickers">${STICKERS.map((_,i)=>sticker(i,i<=level()-1||i===0&&S.xp>0?"":"lock")).join("")}</div>
      <p class="sub">A cada 100 pontos você ganha um adesivo. Tarefa vale 10 + tempo; passo, rotina e bloco de foco também contam.</p>
      <div class="stats" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="box c" style="padding:10px"><b style="font-family:var(--f-display);font-size:30px;color:var(--pink);font-weight:400">${streak}</b><p class="sub">dias com pelo menos 1 vitória (pular 1 dia não zera)</p></div><div class="box c" style="padding:10px"><b style="font-family:var(--f-display);font-size:30px;color:var(--pink);font-weight:400">${S.tasks.filter(t=>t.done).length}</b><p class="sub">coisas destravadas no total</p></div></div>
      <h2 class="label">Últimos 7 dias</h2>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px">${wk.map(d=>{const n=(S.log[d]||[]).length;return `<div style="display:grid;gap:4px;justify-items:center;height:100%;align-content:end"><span class="sub">${n||""}</span><div style="width:100%;height:${n/mx*80}px;background:linear-gradient(var(--pink),var(--purple));min-height:${n?4:0}px"></div><span class="sub">${DOWN[dow(d)]}</span></div>`}).join("")}</div>`}
  if(sec==="ajustes") b=`<div class="form"><label class="full">Seu nome<input data-set="name" value="${esc(S.settings.name)}"></label><label>Acordo por volta de<input type="time" data-set="wakeH" value="${esc(S.settings.wakeH)}"></label><label>Durmo por volta de<input type="time" data-set="sleepH" value="${esc(S.settings.sleepH)}"></label></div>
    <p class="sub">Os horários servem para mostrar o tempo livre do dia.</p>
    <h2 class="label">Backup</h2><p class="sub">Tudo fica só neste celular. Copie o backup de vez em quando e guarde nas Notas.</p>
    <div class="row"><button class="ghost" type="button" data-a="copyJson">Copiar backup</button></div>
    <textarea id="backupBox" placeholder="Cole aqui um backup e toque em Restaurar" aria-label="Backup"></textarea>
    <div class="row"><button class="ghost" type="button" data-a="restore">Restaurar do texto</button><span class="sub" id="bkMsg"></span></div>
    <p class="sub">Outros apps: <a href="../" style="color:var(--lilac)">Treino</a> · <a href="../vida/" style="color:var(--lilac)">Vida</a> · <a href="../grana/" style="color:var(--lilac)">Bia$</a></p>`;
  return `<section><div class="chips">${tabs.map(([k,l])=>`<button class="chip" type="button" data-a="mais" data-k="${k}" aria-pressed="${sec===k}">${l}</button>`).join("")}</div>${b}</section>`;
}

/* =====================================================================
   RENDER E EVENTOS
   ===================================================================== */
function render(){
  hello();
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.tab===S.ui.tab)));
  $("#view").innerHTML=({hoje:vHoje,agenda:vAgenda,tudo:vTudo,foco:vFoco,mais:vMais}[S.ui.tab]||vHoje)();
  document.getElementById("storeWarn").hidden=storeOk;
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function go(tab){S.ui.tab=tab;S.ui.confirm=null;save();render();window.scrollTo(0,0)}
setInterval(()=>{if(S.ui.tab==="foco")ftick()},500);
setInterval(()=>{if(S.ui.tab==="hoje"&&!document.activeElement.matches("input,textarea,select"))rerender()},60000);
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.tab)});

/* captura */
$("#capIn").addEventListener("input",e=>{const v=e.target.value.trim();if(!v){$("#parsed").innerHTML="";return}const p=parseCap(v);
  $("#parsed").innerHTML=[p.event?`<span class="tag trab">compromisso</span>`:`<span class="tag">${TIPOS[p.tipo]}</span>`,`<span class="tag ${p.area}">${p.area==="trab"?"trabalho":"casa"}</span>`,p.date?`<span class="tag">${dayLabel(p.date)}</span>`:"",p.time?`<span class="tag">${p.time}</span>`:"",`<span class="tag">${durTxt(p.min)}</span>`,p.prio?`<span class="tag pr">importante</span>`:""].join("")});
$("#capForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#capIn").value.trim();if(!v)return;const r=addFromCap(v);$("#capIn").value="";$("#parsed").innerHTML="";award(1,"");S.log[today()].pop();save(true);
  toast(r.kind==="event"?`Compromisso: ${r.obj.t} · ${dayLabel(r.obj.date)} ${r.obj.start}`:`Guardado: ${r.obj.t}${r.obj.when?" · "+dayLabel(r.obj.when):""}`);rerender()});

$("#view").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.ui){S.ui[t.dataset.ui]=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{rerender();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(x){}}},300);return}
  if(t.dataset.te&&t.type!=="checkbox"&&t.tagName==="INPUT"&&t.type==="text"){const [id,k]=t.dataset.te.split(".");task(id)[k]=t.value;save();return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.value;save();return}
  if(t.dataset.lz!=null){S.limpeza[t.dataset.lz].z=t.value;save();return}
});
$("#view").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.te){const [id,k]=t.dataset.te.split("."),x=task(id);let v=t.type==="checkbox"?t.checked:t.value;if(["min","energy"].includes(k))v=+v;if(k==="recur")v=v?+v:null;if(["when","time","due"].includes(k)&&!v)v=null;x[k]=v;save(true);rerender();return}
  if(t.dataset.set){S.settings[t.dataset.set]=t.value;save(true);return}
});
$("#view").addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.fold){(S.ui.folds=S.ui.folds||{})[d.dataset.fold]=d.open;save()}},true);
$("#view").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input[id^=ns-],#fs-new,input[id^=nr-],input[id^=nl-]")){e.preventDefault();const b=e.target.parentElement.querySelector("button");if(b)b.click()}});
$("#view").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a, id=b.dataset.id, t=id?task(id):null, td=today();
  if(!["delT","delEv"].includes(a))S.ui.confirm=null;
  const conf=(k,fn)=>{if(S.ui.confirm===k){fn();S.ui.confirm=null}else S.ui.confirm=k};
  switch(a){
    case "energy":S.energy=+b.dataset.v;break;
    case "pick":{const p=pickOne(Math.min(freeNow(),180));if(!p){toast("Lista vazia. Despeja alguma coisa no topo.");return}S.ui.focus=p.id;go("foco");return}
    case "pick3":S.ui.pick3=b.dataset.i===""?null:+b.dataset.i;break;
    case "set3":{const L=(S.three[td]=S.three[td]||[]).filter(x=>task(x));if(L.length<3)L.push(id);S.three[td]=L;S.ui.pick3=null;const x=task(id);if(!x.when||x.when<td)x.when=td;break}
    case "done":{if(t.done){t.done=null;S.xp=Math.max(0,S.xp-(10+Math.round(t.min/5)))}else completeTask(t);break}
    case "focus":S.ui.focus=id;FT={end:0,total:0,int:null,paused:0};go("foco");return;
    case "lateAll":{const L=S.tasks.filter(x=>open(x)&&x.when&&x.when<td);L.forEach((x,i)=>{if(b.dataset.v==="today")x.when=td;else if(b.dataset.v==="spread")x.when=addDays(td,i%7);else{x.someday=true;x.when=null}});toast(b.dataset.v==="someday"?"Guardado em Algum dia. Sem culpa.":"Reorganizado. Recomeço limpo.");break}
    case "rot":{const k=b.dataset.k,i=+b.dataset.i,L=((S.rotLog[td]=S.rotLog[td]||{})[k]=S.rotLog[td][k]||[]);const j=L.indexOf(i);if(j>=0)L.splice(j,1);else{L.push(i);award(1,S.rot[k][i]);if(L.length===S.rot[k].length){burst();toast("Rotina completa!")}}break}
    case "limp":{const L=(S.limpLog[td]=S.limpLog[td]||[]),i=+b.dataset.i,j=L.indexOf(i);if(j>=0)L.splice(j,1);else{L.push(i);award(2,S.limpeza[dow(td)].l[i]);if(L.length===S.limpeza[dow(td)].l.length){burst();toast("Limpeza do dia feita!")}}break}
    case "limpFocus":{const z=S.limpeza[dow(td)];let x=S.tasks.find(y=>y.limp===td);if(!x){x={id:uid(),t:`Limpeza: ${z.z}`,tipo:"limpar",area:"casa",min:10,energy:1,when:td,time:null,due:null,steps:z.l.map(s=>({t:s,ok:false})),prio:false,created:td,done:null,someday:false,limp:td};S.tasks.push(x)}S.ui.focus=x.id;FT={end:0,total:0,int:null,paused:0};save(true);go("foco");setTimeout(()=>{const s=document.querySelector('[data-a=fStart][data-v="5"]');startFocus(10)},0);return}
    case "openT":S.ui.open=S.ui.open===id?null:id;break;
    case "step":{const s=t.steps[+b.dataset.i];s.ok=!s.ok;if(s.ok){award(2,s.t);if(t.steps.every(x=>x.ok)&&S.ui.tab==="foco")toast("Todos os passos! Toque em Terminei tudo.");else toast("Passo feito ✦")}break}
    case "rmStep":t.steps.splice(+b.dataset.i,1);break;
    case "addStep":{const v=$("#ns-"+id).value.trim();if(!v)return;t.steps.push({t:v,ok:false});break}
    case "fAddStep":{const v=$("#fs-new").value.trim();if(!v)return;const i=t.steps.findIndex(s=>!s.ok);t.steps.splice(i<0?t.steps.length:i,0,{t:v,ok:false});toast("Passo menor adicionado. Faz só ele.");break}
    case "tplSteps":t.steps=(STEP_TPL[t.tipo]||STEP_TPL.outro).map(s=>({t:s,ok:false}));break;
    case "someday":t.someday=!t.someday;if(t.someday)t.when=null;break;
    case "delT":conf("t"+id,()=>{S.tasks=S.tasks.filter(x=>x.id!==id);Object.values(S.three).forEach(L=>{const j=L.indexOf(id);if(j>=0)L.splice(j,1)})});break;
    case "calT":sendToCalendar([{id:t.id,t:t.t,date:t.when,start:t.time,end:toH(toMin(t.time)+t.min),remind:10}]);return;
    case "filter":S.ui.filter=b.dataset.k;break;
    case "wk":S.ui.day=addDays(S.ui.day||td,+b.dataset.v);break;
    case "day":S.ui.day=b.dataset.d;break;
    case "newEv":S.ui.evForm="new";break;
    case "editEv":S.ui.evForm=id;break;
    case "cancelEv":S.ui.evForm=null;break;
    case "saveEv":{const v=$("#ev-t").value.trim();if(!v){toast("Escreva o que é o compromisso.");return}
      const data={t:v,date:$("#ev-d").value||S.ui.day||td,start:$("#ev-s").value||null,end:$("#ev-e").value||null,area:$("#ev-a").value,remind:+$("#ev-r").value};
      let ev=id?S.events.find(x=>x.id===id):null;if(ev)Object.assign(ev,data);else{ev={id:uid(),...data};S.events.push(ev)}S.ui.evForm=null;S.ui.day=data.date;save(true);
      if(b.dataset.cal){if(!ev.start){toast("Coloque o horário para o iPhone avisar.");rerender();return}sendToCalendar([ev])}break}
    case "delEv":conf("ev"+id,()=>{S.events=S.events.filter(x=>x.id!==id);S.ui.evForm=null});break;
    case "cal":{const ev=S.events.find(x=>x.id===id);if(!ev.start){toast("Coloque o horário para o iPhone avisar.");return}sendToCalendar([ev]);return}
    case "calWeek":{const sel=S.ui.day||td,st=addDays(sel,-((dow(sel)+6)%7)),en=addDays(st,6);sendToCalendar(S.events.filter(e=>e.date>=st&&e.date<=en&&e.start));return}
    case "fStart":startFocus(+b.dataset.v);return;
    case "fPause":FT.paused=Math.max(0,Math.round((FT.end-Date.now())/1000));break;
    case "fResume":FT.end=Date.now()+FT.paused*1000;FT.paused=0;break;
    case "fStop":clearInterval(FT.int);FT={end:0,total:0,int:null,paused:0};break;
    case "fLeave":S.ui.focus=null;FT={end:0,total:0,int:null,paused:0};break;
    case "mais":S.ui.mais=b.dataset.k;break;
    case "addRot":{const v=$("#nr-"+b.dataset.k).value.trim();if(!v)return;S.rot[b.dataset.k].push(v);break}
    case "rmRot":S.rot[b.dataset.k].splice(+b.dataset.i,1);break;
    case "addLz":{const v=$("#nl-"+b.dataset.d).value.trim();if(!v)return;S.limpeza[b.dataset.d].l.push(v);break}
    case "rmLz":S.limpeza[b.dataset.d].l.splice(+b.dataset.i,1);break;
    case "copyJson":{const txt=JSON.stringify(Object.assign({},S,{ui:undefined})),box=$("#backupBox");box.value=txt;try{navigator.clipboard.writeText(txt).then(()=>$("#bkMsg").textContent="Backup copiado.",()=>{box.select();$("#bkMsg").textContent="Selecionado: toque em Copiar."})}catch(x){box.select()}return}
    case "restore":{try{const d=JSON.parse($("#backupBox").value);if(!d||!d.tasks)throw 0;S=Object.assign(fresh(),d);S.ui=Object.assign(fresh().ui,{tab:"mais",mais:"ajustes"});save(true);render();$("#bkMsg").textContent="Backup restaurado."}catch(x){$("#bkMsg").textContent="Esse texto não é um backup válido."}return}
  }
  save(true);rerender();
});
function startFocus(m){FT={end:Date.now()+m*60000,total:m*60,paused:0,int:null};award(3,"");S.log[today()].pop();save(true);rerender()}

try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
save(true);render();
</script>

</body></html>
